<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body style="margin:0;background:#333">
<iframe id="f" style="border:0;position:fixed;top:0;left:0;width:1200px;height:740px"></iframe>
<pre id="out" style="color:#0f0"></pre>
<script>
const Q=new URLSearchParams(location.search);
const f=document.getElementById("f");
const w=+Q.get("w")||1200,h=+Q.get("h")||740;
f.style.width=w+"px";f.style.height=h+"px";
const mock={
  core:{invoke:async(cmd,args)=>{
    if(cmd==="library_snapshot")return FAKE_TRACKS;
    if(cmd==="scan_library")return {tracks:FAKE_TRACKS,skipped:[],unsupported:0};
    if(cmd==="open_track"){const t=FAKE_TRACKS.find(t=>t.path===args.path)||FAKE_TRACKS[0];return {...t,embedded_lyrics:null}}
    if(cmd==="media_url")return "";
    if(cmd==="cover_url")return GEN;
    if(cmd==="settings_load")return null;
    if(cmd==="settings_save")return "ok";
    if(cmd==="lyrics_get")return {source:"lrclib",synced:true,lines:FAKE_LRC};
    return null;
  },transformCallback:cb=>cb},
  event:{listen(){return Promise.resolve(()=>{})},emit(){return Promise.resolve()}},
  window:{getCurrentWindow(){return mockWin()},getAllWindows:async()=>[mockWin()]},
};
function mockWin(){return {label:"main",hide(){},show(){},minimize(){},destroy(){},setFocus(){},
  isVisible:async()=>true,setAlwaysOnTop(){},scaleFactor:async()=>1,innerSize:async()=>({width:w,height:h}),
  onCloseRequested(){},startDragging(){}}}
const GEN=(()=>{const c=document.createElement("canvas");c.width=64;c.height=64;const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,64,64);gr.addColorStop(0,"#e0a");gr.addColorStop(1,"#0af");
  g.fillStyle=gr;g.fillRect(0,0,64,64);return c.toDataURL("image/png")})();
function fakeTrack(k){const f=[["FLAC",true,44100,16,2],["WAV",true,48000,24,2],["MP3",false,44100,16,2]][k%3];
  return {path:"C:\\Music\\t"+k+".flac",title:"Track "+k,artist:"Artist "+k,album:"Album "+(k%3),
  duration_s:194,streaminfo:{sample_rate:f[2],bits:f[3],channels:f[4],total_samples:0},
  format:f[0],lossless:f[1],bitrate_kbps:900,has_cover:true,replaygain:null,cover:null}}
const FAKE_TRACKS=[0,1,2].map(fakeTrack);
const FAKE_LRC=[0,1,2,3,4,5].map(k=>({t:k*5,text:"Line "+k}));
window.__HT_TAURI_MOCK__=mock;
f.src="../"+(Q.get("page")||"main")+".html?"+Q.toString();
f.addEventListener("load",()=>{
  setTimeout(()=>{
    try{
      const iw=f.contentWindow,id=f.contentDocument;
      const secs=[".shell",".shell-body",".app-shell",".mini-bar",".nav",".views","#npbar",".widget-stage",".w-head",".w-meta",".w-title",".w-artist",".w-tech",".w-time",".w-transport",".w-seek"];
      const out={inner:{w:iw.innerWidth,h:iw.innerHeight},dpr:iw.devicePixelRatio,
        T:!!iw.T,mockDirect:!!iw.__HT_TAURI_MOCK__,inv:iw.window.__invoke?!!iw.window.__invoke._ht:null,
        rootNav:id.documentElement.getAttribute("data-nav"),theme:iw.Theme&&iw.Theme.name,
        lib:(iw.S&&iw.S.lib.length)||0,playing:iw.S&&iw.S.playing,meta:iw.S&&iw.S.meta&&iw.S.meta.title,
        lyr:iw.S?{n:iw.S.lyrics.length,st:iw.S.lyricsStatus}:null,bootErr:iw.__HT_BOOT_ERR||null};
      out.rects={};
      for(const sel of secs){const e=id.querySelector(sel);if(!e)continue;const r=e.getBoundingClientRect();
        out.rects[sel]={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),
          bottom:Math.round(r.bottom),display:getComputedStyle(e).display,vis:r.width>0&&r.height>0}}
      out.navItems=[...id.querySelectorAll(".nav-item")].map(n=>{const r=n.getBoundingClientRect();
        return {v:n.dataset.view,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),
          disp:getComputedStyle(n).display}}); 
      document.getElementById("out").textContent="HTPROBE "+JSON.stringify(out);
    }catch(e){document.getElementById("out").textContent="HTPROBE-ERR "+e.message}
  },+Q.get("wait")||2200);
});
</script>
</body></html>
