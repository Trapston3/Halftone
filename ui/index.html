<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halftone</title>
<style>
/* ============================================================
   HALFTONE widget — Phosphor visual language, real shell build
   Backend: Rust direct-FLAC pipeline (docs/audio-pipeline.md)
   Same discipline: 4px scale · radius 8/6/3 · border-tier depth
   · 3 type tiers · one signature moment (seek/visualizer)
   ============================================================ */
:root{
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --r-w:8px;--r-b:6px;--r-l:3px;
  --bg:#16181A;--bg2:#1B1E21;
  --line:#262B30;--line2:#3A4147;
  --accent:#66E0C2;
  --accent-22:rgba(102,224,194,.22);
  --cream:#F2E8CF;--dim:#8B949C;--dim2:#566066;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg);color:var(--cream);
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.mono{font-family:Consolas,ui-monospace,monospace}

/* ---- shell: head is the drag region (pointer-events:none on text) ---- */
.widget{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.widget::after{ /* scanlines */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 3px);
}
.head{display:flex;gap:var(--sp3);padding:var(--sp3);cursor:grab}
.artwrap{flex:none}
canvas.art{width:96px;height:96px;border-radius:var(--r-b);border:1px solid var(--line);display:block;background:#12171A}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column;pointer-events:none}
.trk-no{font-size:10px;letter-spacing:.18em;color:var(--accent)}
.title{margin-top:var(--sp1);font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech{margin-top:var(--sp1);font-size:10px;letter-spacing:.1em;color:var(--dim2)}
.tools{margin-top:auto;display:flex;gap:var(--sp1);pointer-events:auto}
.tools button{
  position:relative;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-b);color:var(--dim);transition:border-color .12s,color .12s;
}
.tools button:hover{border-color:var(--line2);color:var(--cream)}
.tools button.on{border-color:var(--accent);color:var(--accent)}
.ico{width:14px;height:14px;display:block}
.tools button::after{
  content:attr(data-tip);
  position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);
  padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r-l);
  background:var(--bg2);color:var(--cream);
  font-size:10px;font-weight:600;letter-spacing:.14em;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:9;
}
.tools button.tip-on::after,
.tools button:focus-visible::after{opacity:1}

/* ---- seek meter (signature component; drag interaction = pass N) ---- */
.seekwrap{padding:0 var(--sp3);position:relative}
.seek{position:relative;height:12px;cursor:pointer;touch-action:none;border-radius:var(--r-l)}
.seek.open{height:30px}
.seek canvas{position:absolute;inset:0;width:100%;height:100%}
.times{
  display:flex;justify-content:space-between;margin-top:var(--sp1);
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--dim2);
  opacity:0;transition:opacity .15s ease;
}
.seekwrap:hover .times,.seek.dragging .times{opacity:1}
.tip{
  position:absolute;bottom:calc(100% + 2px);left:0;transform:translateX(-50%);
  padding:2px 6px;border:1px solid var(--accent);border-radius:var(--r-l);
  color:var(--accent);font-size:10.5px;font-variant-numeric:tabular-nums;
  background:var(--bg2);display:none;white-space:nowrap;z-index:3;
}
.seek.dragging .tip{display:block}

/* ---- controls ---- */
.controls{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3)}
.cbtn{
  width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-b);color:var(--cream);transition:border-color .12s;
}
.cbtn:hover{border-color:var(--line2)}
.cbtn:active{transform:translateY(1px)}
.cbtn svg{width:15px;height:15px}
.play{border-color:var(--accent);background:var(--accent);color:#0A0E0C}
.play:hover{filter:brightness(1.08)}
.vol{margin-left:auto;display:flex;align-items:center;gap:var(--sp2)}
.vol svg{width:14px;height:14px;color:var(--dim)}
.leds{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:var(--r-b)}
.led{width:5px;height:10px;border-radius:1.5px;background:#232A2E;cursor:pointer}
.led.on{background:var(--accent)}

/* ---- lyrics ---- */
.lyrics{overflow:hidden;max-height:0;transition:max-height .45s cubic-bezier(.2,.9,.2,1)}
.lyrics.open{max-height:168px}
.lyr-view{
  height:168px;overflow:hidden;padding:0 var(--sp4);
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
          mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
}
.lyr-wrap{transform:translateY(64px);transition:transform .5s cubic-bezier(.25,.9,.2,1)}
.line{padding:6px 0;font-size:12px;line-height:1.5;color:rgba(242,232,207,.38);transition:color .25s ease}
.line.active{color:var(--cream)}
.line.active::before{content:"▸ ";color:var(--accent)}

/* ---- popovers ---- */
.pop{
  position:fixed;z-index:5;min-width:250px;max-width:376px;background:var(--bg2);
  border:1px solid var(--line2);border-radius:var(--r-b);box-shadow:0 8px 24px rgba(0,0,0,.4);
  padding:var(--sp2);display:none;
}
.pop.open{display:block}
#queue{right:var(--sp3);bottom:56px;width:340px}
#libpop{left:var(--sp3);top:var(--sp3);width:340px}
.qscroll{max-height:150px;overflow-y:auto}
.qscroll::-webkit-scrollbar{width:6px}
.qscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.prow{display:flex;align-items:center;gap:var(--sp2);width:100%;padding:var(--sp2) var(--sp1);border-radius:var(--r-l);text-align:left}
.prow:hover{background:var(--accent-22)}
.prow .n{font-size:10px;color:var(--dim2);width:18px}
.prow .t{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .d{font-size:10px;color:var(--dim2)}
.prow.cur .t{color:var(--accent)}
.prow.cur .n{color:var(--accent)}
.pop .cap{font-size:10px;letter-spacing:.16em;color:var(--dim2);padding:var(--sp1) var(--sp2) var(--sp2)}
.librow{display:flex;gap:var(--sp1)}
.librow input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);
  color:var(--cream);font:11px Consolas,monospace;padding:6px 8px;
}
.librow input:focus{outline:none;border-color:var(--accent)}
.librow button{
  padding:6px 12px;border:1px solid var(--line2);border-radius:var(--r-l);
  font-size:10px;letter-spacing:.14em;color:var(--cream);
}
.librow button:hover{border-color:var(--accent);color:var(--accent)}
.libstat{margin-top:var(--sp2);font-size:10px;letter-spacing:.1em;color:var(--dim2)}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="head" id="dragzone" data-tauri-drag-region>
    <div class="artwrap"><canvas class="art" id="art" width="96" height="96"></canvas></div>
    <div class="hmeta">
      <div class="trk-no mono" id="trkNo">HALFTONE / NO LIBRARY</div>
      <div class="title" id="tTitle">scan a folder to begin</div>
      <div class="tech mono" id="tTech">DIRECT FLAC / NO TRANSCODE</div>
      <div class="tools">
        <button id="btnLib" data-tip="LIBRARY · SCAN FOLDER" aria-label="Library: scan folder">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M9 20h6M12 5v15"/></svg>
        </button>
        <button id="btnPin" data-tip="PIN · ALWAYS ON TOP" aria-pressed="false" aria-label="Pin: always on top">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.7 2 6 4.7 6 8c0 4.5 6 12 6 12s6-7.5 6-12c0-3.3-2.7-6-6-6z"/><circle cx="12" cy="8" r="2.2"/></svg>
        </button>
        <button id="btnLyrics" data-tip="LYRICS · SYNCED" aria-label="Synced lyrics">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="16.5" cy="15" r="2.3"/></svg>
        </button>
        <button id="btnQueue" data-tip="QUEUE · LIBRARY" aria-label="Queue">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h16M4 16h7"/><path d="M14 14.5l6 2.5-6 2.5z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="seekwrap">
    <div class="seek" id="seek">
      <canvas id="seekCv"></canvas>
      <div class="tip mono" id="tip">00:00 / 00:00</div>
    </div>
    <div class="times mono"><span id="tCur">00:00</span><span id="tTot">00:00</span></div>
  </div>

  <div class="controls">
    <button class="cbtn" id="btnPrev" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6z"/><path d="M20 5.4v13.2c0 .8-.9 1.3-1.6.9L9.5 12.7a1 1 0 0 1 0-1.7l8.9-5.9c.7-.4 1.6.1 1.6.9z"/></svg>
    </button>
    <button class="cbtn play" id="btnPlay" title="Play / pause">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8a1 1 0 0 0 0-1.7L9.8 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
    </button>
    <button class="cbtn" id="btnNext" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.4v13.2c0 .8.9 1.3 1.6.9l8.9-5.8a1 1 0 0 0 0-1.7L5.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    </button>
    <div class="vol">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/></svg>
      <div class="leds" id="leds" role="slider" aria-label="Volume" tabindex="0"></div>
    </div>
  </div>

  <div class="lyrics" id="lyrics">
    <div class="lyr-view"><div class="lyr-wrap mono" id="lyrWrap"></div></div>
  </div>
</div>

<div class="pop" id="queue">
  <div class="cap mono">QUEUE / LIBRARY</div>
  <div class="qscroll" id="qrows"></div>
</div>
<div class="pop" id="libpop">
  <div class="cap mono">LIBRARY FOLDER</div>
  <div class="librow">
    <input id="libpath" type="text" spellcheck="false" placeholder="C:\Users\you\Music">
    <button id="libscan" class="mono">SCAN</button>
  </div>
  <div class="libstat mono" id="libstat">no scan yet</div>
</div>

<audio id="aud" preload="metadata" crossorigin="anonymous"></audio>

<script>
/* ============ Tauri bridge ============ */
const T=window.__TAURI__;
const invoke=T&&T.core.invoke;
const curWin=T&&T.window.getCurrentWindow();

/* ============ state ============ */
const S={lib:[],i:-1,playing:false,vol:.8,pinned:false,drag:null,lidx:-1,
         lyricsOpen:false,lyrics:[],meta:null,root:null};
window.S=S;
const $=id=>document.getElementById(id);
const el={};
["widget","art","seek","seekCv","tip","tCur","tTot","tTitle","tTech","trkNo",
 "lyrics","lyrWrap","qrows","queue","libpop","libpath","libscan","libstat",
 "leds","icoPlay","icoPause","btnPlay","btnPin","btnLyrics","btnQueue","btnLib",
 "btnPrev","btnNext","aud"].forEach(k=>el[k]=$(k));
const trk=()=>S.lib[S.i];
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* ============ accent system (ported from verified sketch) ============ */
function rgb2hsl(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h/=6}
  return {h,s,l}}
function hsl2rgb(h,s,l){const f=n=>{const k=(n+h*12)%12;const a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return [f(0)*255,f(8)*255,f(4)*255]}
const lin=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const lum=(r,g,b)=>.2126*lin(r)+.7152*lin(g)+.0722*lin(b);
const ratio=(l1,l2)=>(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
const BG_LUM=lum(0x16,0x18,0x1A);
function extractAccent(img){const c=document.createElement("canvas");c.width=c.height=24;
  const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(img,0,0,24,24);
  const d=g.getImageData(0,0,24,24).data;
  const W=new Array(12).fill(0),Hh=new Array(12).fill(0),Ss=new Array(12).fill(0),Ll=new Array(12).fill(0);
  for(let i=0;i<d.length;i+=4){const {h,s,l}=rgb2hsl(d[i]/255,d[i+1]/255,d[i+2]/255);
    if(s>.25&&l>.12&&l<.92){const w=s*Math.max(l,.15),b=Math.min(11,Math.floor(h*12));
      W[b]+=w;Hh[b]+=h*w;Ss[b]+=s*w;Ll[b]+=l*w}}
  let best=-1;for(let i=0;i<12;i++)if(W[i]>0&&(best<0||W[i]>W[best]))best=i;
  if(best<0)return {h:.44,s:.62,l:.56};
  return {h:Hh[best]/W[best],s:Ss[best]/W[best],l:Ll[best]/W[best]}}
function clampAccent(a){const h=a.h,s=Math.min(.9,Math.max(.5,a.s));let l=Math.min(.68,Math.max(.45,a.l));
  while(l<.82){const [r,g,b]=hsl2rgb(h,s,l);if(ratio(lum(r,g,b),BG_LUM)>=3)break;l+=.02}
  return {h,s,l}}
const ACC={cur:{h:.44,s:.62,l:.56},from:null,to:null,t0:0,dur:420,anim:false,hex:[102,224,194]};
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const lerpHue=(a,b,k)=>{let d=b-a;if(d>.5)d-=1;if(d<-.5)d+=1;return (a+d*k+1)%1};
function applyAccent(){const [r,g,b]=hsl2rgb(ACC.cur.h,ACC.cur.s,ACC.cur.l).map(v=>Math.round(v));
  ACC.hex=[r,g,b];const rs=document.documentElement.style;
  rs.setProperty("--accent",`rgb(${r},${g},${b})`);
  rs.setProperty("--accent-22",`rgba(${r},${g},${b},.22)`)}
function tweenAccent(to){ACC.from={...ACC.cur};ACC.to=to;ACC.t0=performance.now();ACC.anim=true}
function tickAccent(now){if(!ACC.anim)return false;
  const k=easeIO(Math.min(1,(now-ACC.t0)/ACC.dur));
  ACC.cur.h=lerpHue(ACC.from.h,ACC.to.h,k);ACC.cur.s=ACC.from.s+(ACC.to.s-ACC.from.s)*k;
  ACC.cur.l=ACC.from.l+(ACC.to.l-ACC.from.l)*k;applyAccent();
  if(k>=1)ACC.anim=false;return true}

/* ============ art: Bayer dither LED grid (ported) ============ */
const BAYER=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],
  [60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],
  [15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]].map(r=>r.map(v=>v/64));
const ART_GRID=32;
let artImg=null;
function renderArt(){const cv=el.art,dpr=Math.min(2,devicePixelRatio||1);const size=96*dpr;
  cv.width=size;cv.height=size;const g=cv.getContext("2d");
  g.fillStyle="#12171A";g.fillRect(0,0,size,size);
  if(!artImg)return;
  const off=document.createElement("canvas");off.width=off.height=ART_GRID;
  const og=off.getContext("2d",{willReadFrequently:true});og.drawImage(artImg,0,0,ART_GRID,ART_GRID);
  const px=og.getImageData(0,0,ART_GRID,ART_GRID).data;const cell=size/ART_GRID;const [ar,ag,ab]=ACC.hex;
  for(let y=0;y<ART_GRID;y++)for(let x=0;x<ART_GRID;x++){
    const i=(y*ART_GRID+x)*4;
    const lumv=(px[i]*.2126+px[i+1]*.7152+px[i+2]*.0722)/255;
    const v=lumv+(BAYER[y%8][x%8]-.5)*.55;
    if(v>.62)g.fillStyle=`rgb(${ar},${ag},${ab})`;
    else if(v>.38)g.fillStyle=`rgba(${ar},${ag},${ab},.45)`;
    else continue;
    g.fillRect(x*cell,y*cell,cell-.75,cell-.75)}}

/* ============ analyser (log buckets + EMA, ported) ============ */
let AC=null,analyser=null,DATA=null,BINS=null,gainNode=null;
const NBARS=48,EMA=new Float32Array(NBARS);
function ensureAudio(){if(AC)return true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    analyser=AC.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.8;
    gainNode=AC.createGain();gainNode.gain.value=S.vol;
    analyser.connect(gainNode);gainNode.connect(AC.destination);
    const ms=AC.createMediaElementSource(el.aud);ms.connect(analyser);
    DATA=new Uint8Array(analyser.frequencyBinCount);
    const fMin=40,fMax=Math.min(15000,AC.sampleRate/2),K=AC.sampleRate/analyser.fftSize;BINS=[];
    for(let i=0;i<NBARS;i++){const f0=fMin*Math.pow(fMax/fMin,i/NBARS),f1=fMin*Math.pow(fMax/fMin,(i+1)/NBARS);
      let b0=Math.max(0,Math.floor(f0/K)),b1=Math.min(DATA.length,Math.max(b0+1,Math.ceil(f1/K)));BINS.push([b0,b1])}
    return true;
  }catch(e){console.error("audio init",e);return false}}
function bars(){const out=new Float32Array(NBARS);
  if(analyser&&S.playing)analyser.getByteFrequencyData(DATA);
  for(let i=0;i<NBARS;i++){let v=0;
    if(analyser&&S.playing){const [b0,b1]=BINS[i];let s=0;for(let b=b0;b<b1;b++)s+=DATA[b];
      v=Math.min(1,(s/(b1-b0))/255*(.55+.75*Math.pow((i+1)/NBARS,.6)))}
    const p=EMA[i];EMA[i]=v>p?p+(v-p)*.5:p+(v-p)*.14;if(!S.playing)EMA[i]*=.9;out[i]=EMA[i]}
  return out}
function drawSeek(){const box=el.seek,W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const dpr=Math.min(2,devicePixelRatio||1);
  if(el.seekCv.width!==Math.round(W*dpr)||el.seekCv.height!==Math.round(H*dpr)){el.seekCv.width=Math.round(W*dpr);el.seekCv.height=Math.round(H*dpr)}
  const g=el.seekCv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const spec=bars(),gap=2,cw=Math.max(2,(W-gap*(NBARS-1))/NBARS);
  const rows=Math.max(2,Math.floor((H-2)/4));
  const prog=trk()?(S.drag!=null?S.drag.p:(el.aud.currentTime/el.aud.duration||0)):0;
  const [ar,ag,ab]=ACC.hex;
  for(let i=0;i<NBARS;i++){
    const played=(i+.5)/NBARS<prog;
    const lit=Math.round(Math.max(.08,spec[i])*rows);
    for(let r=0;r<rows;r++){
      const y=H-2-(r+1)*4;
      if(r<lit) g.fillStyle=played?`rgb(${ar},${ag},${ab})`:`rgba(${ar},${ag},${ab},.22)`;
      else      g.fillStyle=played?`rgba(${ar},${ag},${ab},.08)`:"#232A2E";
      g.fillRect(i*(cw+gap),y,cw,3);
    }
  }
  const px=prog*W;
  g.fillStyle="#F2E8CF";g.fillRect(px-.75,0,1.5,H);
  g.beginPath();g.moveTo(px-3,0);g.lineTo(px+3,0);g.lineTo(px,4);g.closePath();g.fill()}

/* ============ lyrics ============ */
function buildLyrics(){el.lyrWrap.innerHTML="";
  S.lyrics.forEach(L=>{const d=document.createElement("div");d.className="line";d.textContent=L.text;d.dataset.t=L.t;el.lyrWrap.appendChild(d)});
  S.lidx=-1}
function updateLyrics(){if(!S.lyricsOpen)return;
  const t=el.aud.currentTime;const lines=[...el.lyrWrap.children];
  let idx=-1;for(let i=0;i<lines.length;i++){if(t>=+lines[i].dataset.t)idx=i}
  if(idx===S.lidx)return;S.lidx=idx;
  lines.forEach((l,i)=>l.classList.toggle("active",i===idx));
  if(idx>=0){const ln=lines[idx];el.lyrWrap.style.transform=`translateY(${64-(ln.offsetTop+ln.offsetHeight/2)}px)`}}

/* ============ library / queue ============ */
function buildQueue(){el.qrows.innerHTML="";
  S.lib.forEach((T2,i)=>{
    const b=document.createElement("button");
    b.className="prow"+(i===S.i?" cur":"");
    b.innerHTML=`<span class="n mono">${String(i+1).padStart(2,"0")}</span><span class="t">${T2.title}</span><span class="d mono">${fmt(T2.duration_s)}</span>`;
    b.onclick=()=>{loadTrack(i);el.queue.classList.remove("open")};
    el.qrows.appendChild(b)})}
async function scanLibrary(dir){
  el.libstat.textContent="scanning "+dir+" ...";
  try{
    const res=await invoke("scan_library",{dir});
    S.lib=res.tracks;S.root=dir;
    localStorage.setItem("halftone.root",dir);
    el.libstat.textContent=res.tracks.length+" TRACKS"+(res.skipped.length?" / "+res.skipped.length+" SKIPPED":"");
    el.trkNo.textContent="HALFTONE / "+res.tracks.length+" TRACKS";
    if(S.i<0&&S.lib.length){el.tTitle.textContent=S.lib[0].title;el.tTech.textContent="READY"}
    buildQueue();
    return res;
  }catch(e){el.libstat.textContent="scan failed: "+e;return null}}

/* ============ track load: one read, original bytes ============ */
async function loadTrack(i){
  if(!S.lib.length)return;
  S.i=(i+S.lib.length)%S.lib.length;
  const meta=await invoke("open_track",{path:S.lib[S.i].path});
  S.meta=meta;
  el.tTitle.textContent=meta.title;
  el.tTech.textContent=meta.streaminfo.sampleRate/1000+" kHz / "+meta.streaminfo.bits+"-BIT / "+(meta.streaminfo.channels===2?"STEREO":meta.streaminfo.channels+"CH");
  el.tTot.textContent=fmt(meta.duration_s);
  el.tip.textContent=fmt(0)+" / "+fmt(meta.duration_s);
  const url=await invoke("flac_url",{path:S.lib[S.i].path});
  el.aud.src=url;                     /* original FLAC bytes, no transcode */
  S.lyrics=await invoke("read_lyrics",{path:S.lib[S.i].path});
  buildLyrics();buildQueue();
  if(meta.cover){
    const img=new Image();
    img.onload=()=>{artImg=img;renderArt();tweenAccent(clampAccent(extractAccent(img)))};
    img.src="data:"+meta.cover.mime+";base64,"+meta.cover.data_b64;
  }else{artImg=null;renderArt();tweenAccent({h:.44,s:.62,l:.56})}
  if(S.playing)el.aud.play().catch(()=>{});
}

/* ============ window height sync (lyrics open/close) ============ */
async function syncHeight(){
  if(!curWin)return;
  const target=S.lyricsOpen?426:254;
  try{await curWin.setSize(new T.window.LogicalSize(400,target))}catch(e){console.warn("size",e)}
}

/* ============ transport ============ */
async function setPlaying(p){
  if(p&&!S.meta)await loadTrack(Math.max(S.i,0));
  if(p&&!ensureAudio())return;
  S.playing=p;
  el.icoPlay.style.display=p?"none":"block";
  el.icoPause.style.display=p?"block":"none";
  if(p){AC.resume();el.aud.play().catch(e=>console.warn("play",e))}
  else el.aud.pause();
}
el.aud.addEventListener("ended",()=>loadTrack(S.i+1));
el.aud.addEventListener("timeupdate",()=>{el.tCur.textContent=fmt(el.aud.currentTime)});

/* ============ pointer: drag-to-seek (basic; the drag interaction
   language — segment illumination sweep — is deliberately deferred to the
   interaction pass, per plan) ============ */
const seek=el.seek;
seek.addEventListener("pointerenter",()=>seek.classList.add("open"));
seek.addEventListener("pointerleave",()=>{if(S.drag==null)seek.classList.remove("open")});
seek.addEventListener("pointerdown",e=>{
  try{seek.setPointerCapture(e.pointerId)}catch(_){}
  const r=seek.getBoundingClientRect();
  S.drag={p:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};
  seek.classList.add("open","dragging");
  el.tip.textContent=fmt(S.drag.p*(el.aud.duration||0))+" / "+fmt(el.aud.duration||0);
  el.tip.style.left=(S.drag.p*seek.clientWidth)+"px";
});
seek.addEventListener("pointermove",e=>{
  if(S.drag==null)return;
  const r=seek.getBoundingClientRect();
  S.drag.p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  el.tip.textContent=fmt(S.drag.p*(el.aud.duration||0))+" / "+fmt(el.aud.duration||0);
  el.tip.style.left=(S.drag.p*seek.clientWidth)+"px";
});
const endDrag=()=>{
  if(S.drag==null)return;
  el.aud.currentTime=S.drag.p*(el.aud.duration||0);
  S.drag=null;S.lidx=-1;
  seek.classList.remove("dragging");
  if(!seek.matches(":hover"))seek.classList.remove("open");
};
seek.addEventListener("pointerup",endDrag);
seek.addEventListener("pointercancel",endDrag);

/* ============ tooltips (explicit labels, ported) ============ */
document.querySelectorAll(".tools button").forEach(b=>{
  b.addEventListener("pointerenter",()=>b.classList.add("tip-on"));
  b.addEventListener("pointerleave",()=>b.classList.remove("tip-on"));
  b.addEventListener("click",()=>b.classList.remove("tip-on"));
});

/* ============ buttons ============ */
el.btnPlay.onclick=()=>setPlaying(!S.playing);
el.btnNext.onclick=()=>{if(S.lib.length)loadTrack(S.i+1)};
el.btnPrev.onclick=()=>{
  if(!S.lib.length)return;
  if(el.aud.currentTime>3){el.aud.currentTime=0}
  else{loadTrack(S.i-1)}
};
el.btnLib.onclick=e=>{e.stopPropagation();el.queue.classList.remove("open");el.libpop.classList.toggle("open")};
el.btnQueue.onclick=e=>{e.stopPropagation();el.libpop.classList.remove("open");el.queue.classList.toggle("open");buildQueue()};
document.addEventListener("click",e=>{
  if(!el.queue.contains(e.target)&&!el.btnQueue.contains(e.target))el.queue.classList.remove("open");
  if(!el.libpop.contains(e.target)&&!el.btnLib.contains(e.target))el.libpop.classList.remove("open");
});
el.btnPin.onclick=async()=>{
  S.pinned=!S.pinned;
  el.btnPin.classList.toggle("on",S.pinned);
  el.btnPin.setAttribute("aria-pressed",S.pinned);
  if(curWin){try{await curWin.setAlwaysOnTop(S.pinned)}catch(e){console.warn(e)}}
};
el.btnLyrics.onclick=async()=>{
  S.lyricsOpen=!S.lyricsOpen;
  el.lyrics.classList.toggle("open",S.lyricsOpen);
  el.btnLyrics.classList.toggle("on",S.lyricsOpen);
  await syncHeight();
  if(S.lyricsOpen){S.lidx=-1;updateLyrics()}
};
el.libscan.onclick=()=>scanLibrary(el.libpath.value.trim());
el.libpath.addEventListener("keydown",e=>{if(e.key==="Enter")scanLibrary(el.libpath.value.trim())});

/* ============ LED volume ============ */
const LEDN=5,leds=[];
for(let i=0;i<LEDN;i++){
  const d=document.createElement("div");d.className="led";
  d.onclick=()=>{S.vol=(i+1)/LEDN;paintLeds();el.aud.volume=S.vol;if(gainNode)gainNode.gain.value=S.vol};
  el.leds.appendChild(d);leds.push(d)}
function paintLeds(){leds.forEach((l,i)=>l.classList.toggle("on",S.vol>=(i+1)/LEDN-.01))}
paintLeds();
el.leds.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){S.vol=Math.min(1,S.vol+1/LEDN);paintLeds();el.aud.volume=S.vol;if(gainNode)gainNode.gain.value=S.vol}
  if(e.key==="ArrowLeft"){S.vol=Math.max(0,S.vol-1/LEDN);paintLeds();el.aud.volume=S.vol;if(gainNode)gainNode.gain.value=S.vol}});
el.aud.volume=S.vol;

/* keyboard */
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target===el.leds)return;
  if(e.code==="Space"){e.preventDefault();el.btnPlay.click()}
  if(e.code==="ArrowRight"&&el.aud.duration)el.aud.currentTime=Math.min(el.aud.duration,el.aud.currentTime+5);
  if(e.code==="ArrowLeft")el.aud.currentTime=Math.max(0,el.aud.currentTime-5);
});

/* ============ clock ============ */
function loop(now){
  const tinted=tickAccent(now);
  if(tinted)renderArt();
  drawSeek();updateLyrics();
  requestAnimationFrame(loop);
}

/* ============ QA surface ============ */
window.__qa={
  state:()=>({lib:S.lib.length,i:S.i,playing:S.playing&&!el.aud.paused,
              dur:+(el.aud.duration||0).toFixed(2),src:el.aud.src,
              vol:S.vol,pinned:S.pinned,lyricsOpen:S.lyricsOpen,
              lrc:S.lyrics.length,root:S.root,
              meta:S.meta?{sr:S.meta.streaminfo.sampleRate,bits:S.meta.streaminfo.bits,
                ch:S.meta.streaminfo.channels,cover:!!S.meta.cover,
                blocks:S.meta.block_types}:null}),
  meter:()=>({maxBar:+Math.max(...EMA).toFixed(3),alive:EMA.some(v=>v>.02),ctx:AC?AC.state:"none"}),
  accent:()=>({rgb:"rgb("+ACC.hex.join(",")+")",animating:ACC.anim,
               ratioVsBg:+ratio(lum(...ACC.hex),BG_LUM).toFixed(2)}),
  artLit:()=>{const g=el.art.getContext("2d");const d=g.getImageData(0,0,el.art.width,el.art.height).data;
    let lit=0,n=0;for(let i=0;i<d.length;i+=64){n++;if(d[i]>32||d[i+1]>32||d[i+2]>32)lit++}
    return +(lit/n).toFixed(3)},
  async play(){await setPlaying(true);return this.state()},
  async load(i){await loadTrack(i);return this.state()},
  async scan(dir){return await scanLibrary(dir)},
};

/* ============ boot ============ */
applyAccent();renderArt();requestAnimationFrame(loop);
const savedRoot=localStorage.getItem("halftone.root");
if(savedRoot){el.libpath.value=savedRoot;scanLibrary(savedRoot)}
</script>
</body>
