<!doctype html>
<html lang="en" data-theme="analogue" data-mode="dark" data-motion="full" data-density="cozy" data-surface="widget">
<head>
<meta charset="utf-8">
<title>Halftone widget</title>
<link rel="stylesheet" href="themes/base.css">
<link rel="stylesheet" href="themes/analogue.css">
<link rel="stylesheet" href="themes/digital.css">
<style>
/* ============ widget page styles ============ */
body{background:transparent;overflow:hidden}

/* ---------- STAGE: designed at logical size, scaled by --s.
   The stage FILLS the window (no letterbox): its logical size is
   innerWidth/s x innerHeight/s. Pointer math uses
   getBoundingClientRect (transform-aware) or the overlay layer. ---------- */
.widget-stage{
  position:fixed;left:0;top:0;transform-origin:0 0;z-index:1;
  display:flex;flex-direction:column;
  background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:calc(var(--R-w));overflow:hidden;
}
.w-head{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp3);min-height:0}
.w-artwrap{position:relative;flex:none}
.w-art{width:96px;height:96px;border-radius:var(--R-m);border:1px solid var(--line-2);
  background:var(--canvas-bg);display:block;object-fit:cover;overflow:hidden;position:relative}
.w-art canvas,.w-art img{width:100%;height:100%;display:block;object-fit:cover}
.w-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.w-title{font-size:1rem;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-artist{font-size:.6875rem;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-tech{font-size:.5625rem;color:var(--fg-3);font-family:var(--font-mono);letter-spacing:.08em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-tech .badge{margin-left:4px;vertical-align:1px}
.w-actions{display:flex;gap:4px;margin-left:auto;flex:none}
.w-actions .btn-icon{width:22px;height:22px}
.w-actions .btn-icon svg{width:12px;height:12px}
.w-gear{position:absolute;right:6px;top:6px;opacity:.5;transition:opacity var(--dur-1)}
.w-gear:hover{opacity:1}
.w-transport{display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3) var(--sp3)}
.w-transport .btn-orb{width:34px;height:34px}
.w-transport .btn-orb.lg{width:42px;height:42px}
.w-transport .btn-orb svg{width:14px;height:14px}
.w-transport .btn-orb.lg svg{width:17px;height:17px}
.w-time{font-size:.625rem;color:var(--fg-3);font-family:var(--font-mono);font-variant-numeric:tabular-nums;min-width:76px}
.w-lyrics-host{flex:1;min-height:0;padding:0 var(--sp3) var(--sp3);display:flex}
.widget-lyrics{flex:1;min-height:0;position:relative}
.widget-lyrics .lyr-view{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.widget-lyrics .lyr-wrap{padding-bottom:40%}
.widget-lyrics .lyr-status{display:flex;gap:var(--sp2);align-items:center;min-height:16px;padding:0 var(--sp1) var(--sp1)}
.widget-lyrics .lyr-status .btn{padding:2px 8px;font-size:.5625rem}
.wp-lyrics .widget-lyrics .lyr-view{position:relative;inset:auto}

/* presets */
.widget-stage.wp-card{--w-base-w:380;--w-base-h:260}
.widget-stage.wp-strip .w-art{width:52px;height:52px}
.widget-stage.wp-strip .w-lyrics-host{display:none}
.widget-stage.wp-strip .w-tech{display:none}
.widget-stage.wp-square .w-artwrap{width:100%}
.widget-stage.wp-square .w-art{width:100%;height:auto;aspect-ratio:1}
.widget-stage.wp-square .w-head{flex-direction:column}
.widget-stage.wp-square .w-meta{padding-top:0}
.widget-stage.wp-lyrics .w-artwrap{display:none}
.widget-stage.wp-lyrics .w-lyrics-host{display:flex}

/* un-scaled overlay: menus/sheets/tooltips live here (never divide by a zoom factor) */
.w-overlay{position:fixed;inset:0;z-index:50;pointer-events:none}
.w-overlay>*{pointer-events:auto}
.w-sheet{position:fixed;right:8px;top:8px;min-width:210px;max-width:calc(100vw - 16px);
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--R-m);
  box-shadow:var(--shadow-2);padding:5px;display:none;backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat))}
.w-sheet.open{display:block;animation:menuin var(--dur-1) var(--ease-out)}
#htToasts{z-index:80}
</style>
</head>
<body data-surface="widget">
<div class="widget-stage wp-card" id="stage">
  <div class="w-head">
    <div class="w-artwrap">
      <div class="w-art art-swap-host" id="wArt">
        <img id="wCover" alt="cover art">
        <canvas class="art-dither" id="wDither"></canvas>
      </div>
    </div>
    <div class="w-meta">
      <div class="w-title" id="wTitle">&#8212;</div>
      <div class="w-artist" id="wArtist">&#8212;</div>
      <div class="w-tech" id="wTech"></div>
      <div style="flex:1"></div>
      <div class="w-time mono" id="wTime">00:00 / 00:00</div>
    </div>
    <div class="w-actions">
      <button class="btn-icon" id="wGear" title="Widget settings" aria-label="Widget settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
      </button>
      <button class="btn-icon" id="wPin" title="Always on top" aria-label="Always on top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z"/></svg>
      </button>
      <button class="btn-icon" id="wMain" title="Open main window" aria-label="Open main window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      </button>
      <button class="btn-icon" id="wClose" title="Quit Halftone" aria-label="Quit Halftone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="seek w-seek" id="wSeek" style="margin:0 var(--sp3);flex:none">
    <canvas class="seek-led"></canvas>
    <div class="seek-gel"><div class="track"><div class="fill"></div><div class="knob"></div></div></div>
    <div class="seek-tip mono">00:00</div>
  </div>
  <div class="w-transport">
    <div class="vol" id="wVol"></div>
    <span style="flex:1"></span>
    <button class="btn-orb" id="wPrev" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6z"/><path d="M20 5.4v13.2c0 .8-.9 1.3-1.6.9L9.5 12.7a1 1 0 0 1 0-1.7l8.9-5.9c.7-.4 1.6.1 1.6.9z"/></svg>
    </button>
    <button class="btn-orb lg" id="wPlay" title="Play / pause">
      <svg id="wIcoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8a1 1 0 0 0 0-1.7L9.8 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
      <svg id="wIcoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
    </button>
    <button class="btn-orb" id="wNext" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.4v13.2c0 .8.9 1.3 1.6.9l8.9-5.8a1 1 0 0 0 0-1.7L5.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    </button>
    <span style="flex:1"></span>
    <button class="btn-icon" id="wShuf" title="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7.5 7.5"/><path d="M3 21l7.5-7.5"/><path d="M16 21h5v-5"/><path d="M15 15l6 6"/><path d="M3 3l6 6"/></svg>
    </button>
    <button class="btn-icon" id="wRep" title="Repeat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>
  <div class="w-lyrics-host" id="wLyrHost" style="display:none">
    <div class="widget-lyrics lyrics">
      <div class="lyr-status" id="wLyrStatus"></div>
      <div class="lyr-view" id="wLyrView"><div class="lyr-wrap mono" id="lyrWrap"></div></div>
    </div>
  </div>
</div>

<!-- un-scaled overlay layer: menus / sheets / toasts -->
<div class="w-overlay" id="wOverlay">
  <div class="w-sheet" id="wSheet">
    <div class="sheet-head"><div class="h1" style="font-size:.75rem" id="wSheetTitle">WIDGET</div></div>
    <div id="wSheetBody" class="sheet-body" style="display:flex;flex-direction:column;gap:2px"></div>
  </div>
</div>

<script>
/* ============================================================
   WIDGET PAGE — pure view + controller (NO audio ownership)
   Scaling: stage transform (T4). No body zoom, no enforceBounds,
   no UIZ division anywhere.
   ============================================================ */
window.IS_VIEWER=true;
const W={s:1,preset:"card",sheetFor:null};
const WID={};
["stage","wCover","wDither","wTitle","wArtist","wTech","wTime","wGear","wPin","wMain","wClose",
 "wSeek","wVol","wPrev","wPlay","wNext","wIcoPlay","wIcoPause","wShuf","wRep",
 "wLyrHost","wLyrView","wLyrStatus","wSheet","wSheetTitle","wSheetBody","wArt"].forEach(k=>WID[k]=document.getElementById(k));

/* ============================================================
   T4: stage scaling
   fit  : s = min(innerW/baseW, innerH/baseH) clamped, stage fills window
   fixed: s = pct/100, stage logical size = window/s (still fills)
   ============================================================ */
const BASE={card:[380,260],strip:[380,120],square:[300,400],lyrics:[380,300]};
function baseSize(){
  return BASE[W.preset]||BASE.card;
}
function applyStage(){
  const [bw,bh]=baseSize();
  let s;
  const mode=W.scaleMode||"fit";
  if(mode==="fixed")s=clamp((+W.scalePct||100)/100,0.7,2);
  else{
    s=Math.min(innerWidth/bw,innerHeight/bh);
    s=clamp(s,0.5,3);
  }
  W.s=s;
  const lw=innerWidth/s,lh=innerHeight/s;
  const st=WID.stage;
  st.style.setProperty("--s",s.toFixed(4));
  st.style.transform="scale("+s.toFixed(4)+")";
  st.style.width=lw+"px";
  st.style.height=lh+"px";
  document.documentElement.style.setProperty("--s",s.toFixed(4));
}
function scheduleStage(){requestAnimationFrame(applyStage)}
addEventListener("resize",scheduleStage);
window.applyWidgetScale=applyStage;
window.addEventListener("DOMContentLoaded",applyStage);
setTimeout(applyStage,0);

/* ============================================================
   Tauri / harness plumbing (same as main)
   ============================================================ */
const T=window.__TAURI__;
function invoke(cmd,args){
  args=args||{};
  if(T&&T.core&&T.core.invoke)return T.core.invoke(cmd,args);
  if(window.__invoke)return window.__invoke(cmd,args);
  return Promise.resolve(null);
}
window.__invoke=invoke;
function listen(name,fn){
  if(T&&T.event&&T.event.listen){try{T.event.listen(name,fn).catch(()=>{})}catch(e){console.warn(e)}}
  else document.addEventListener(name.replace("halftone:","halftone-ev-"),fn);
}
function emitCmd(o){
  if(T&&T.event&&T.event.emit){try{T.event.emit("halftone:cmd",o).catch(()=>{})}catch(_){}}
}
window.emitCmd=emitCmd;
function curWin(){try{return T&&T.window?T.window.getCurrentWindow():null}catch(e){return null}}
window.curWin=curWin();
function wireDrag(elm){
  if(!elm)return;
  elm.addEventListener("pointerdown",e=>{
    if(e.target.closest("button,input,select,.seek,.slider,.menu,.sheet"))return;
    if(e.button!==0)return;
    const w=window.curWin;
    if(w&&w.startDragging){try{w.startDragging()}catch(err){}}
  });
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(sec){sec=Math.max(0,sec|0);const m=(sec/60)|0,s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function toast(msg,kind){
  let box=document.getElementById("htToasts");
  if(!box){box=document.createElement("div");box.id="htToasts";document.body.appendChild(box)}
  const t=document.createElement("div");
  t.className="toast"+(kind?" "+kind:"");
  t.textContent=msg;t.onclick=()=>t.remove();
  box.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),320)},3600);
}
window.toast=toast;

/* ============================================================
   VIEWER STATE (mirrors owner via halftone:sync)
   ============================================================ */
const S={meta:null,playing:false,vol:.8,pos:0,dur:0,shuffle:false,repeat:"off",
  lyrics:[],lyricsPlain:null,lyricsStatus:"none",pinned:true,lyricsOpen:false,
  _barsRcv:new Float32Array(NBARS),lib:[],i:-1,_img:null,_artUrl:null};
window.S=S;
const ACC={cur:[102,224,194],anim:false,from:null,to:null,t0:0};
let themeCanvas={bg:[18,23,26],off:[35,42,46],ink:[242,232,207]};
let themeSeekStyle="led",themeVolStyle="leds",themeArtDefault="dither";
document.addEventListener("halftone:theme",e=>{
  const t=window.Theme||{};
  if(t.canvas)themeCanvas={bg:[...t.canvas.bg],off:[...t.canvas.off],ink:[...t.canvas.ink]};
  themeSeekStyle=t.seekStyle||"led";
  themeVolStyle=t.volStyle||"leds";
  themeArtDefault=t.artDefault||"dither";
  updateSwitchAttrs();
  requestRedraw();
});

/* ============================================================
   SYNC APPLY (from owner)
   ============================================================ */
function applySync(p){
  if(!p)return;
  const prevPath=S.meta?S.meta.path:null;
  S.meta=p.meta||null;
  S.playing=!!p.playing;
  S.vol=p.vol!=null?p.vol:S.vol;
  S.shuffle=!!p.shuffle;
  S.repeat=p.repeat||"off";
  S.pinned=!!p.pinned;
  S.lyricsOpen=!!p.lyricsOpen;
  if(p.pos!=null)S.pos=p.pos;
  if(p.dur!=null)S.dur=p.dur;
  if(p.lyrics){
    S.lyrics=p.lyrics.lines||[];
    S.lyricsPlain=p.lyrics.plain||null;
    S.lyricsStatus=p.lyrics.status||"none";
    buildLyrics();
  }
  if(p.sleepLeft!=null)S._sleepLeft=p.sleepLeft;
  if(S.meta&&S.meta.path!==prevPath)loadArt();
  paintAll();
  document.dispatchEvent(new CustomEvent("halftone:state"));
}
window.applySync=applySync;
function viewerSmoothTick(){return S.pos}
window.viewerSmoothTick=viewerSmoothTick;

/* ============================================================
   ART (coverUrl → img or dither canvas)
   ============================================================ */
async function loadArt(){
  if(!S.meta||!S.meta.path)return;
  try{
    const u=await invoke("cover_url",{path:S.meta.path});
    if(!u)return;
    S._artUrl=u;
    const im=new Image();im.crossOrigin="anonymous";
    im.onload=()=>{S._img=im;requestRedraw();paintArt()};
    im.src=u;
  }catch(e){console.warn("cover_url",e)}
}
function paintArt(){
  const mode=(window.getCfg&&window.getCfg("art"))||"theme";
  const eff=mode==="theme"?themeArtDefault:mode;
  const showReal=eff==="real"&&S._artUrl;
  WID.wCover.style.display=showReal?"":"none";
  WID.wDither.style.display=showReal?"none":"";
  if(showReal){if(WID.wCover.src!==S._artUrl)WID.wCover.src=S._artUrl}
  else if(S._img)drawDither(WID.wDither,S._img);
  const art=WID.wArt;
  art.classList.remove("art-swap");void art.offsetWidth;art.classList.add("art-swap");
}

/* ============================================================
   PAINT (all surfaces update from state; theme-token colors)
   ============================================================ */
function paintAll(){paintInfo();paintArt();paintState();paintLyricsStatus()}
function paintInfo(){
  const m=S.meta;
  WID.wTitle.textContent=m?m.title:"\u2014";
  WID.wArtist.textContent=m?m.artist:"\u2014";
  WID.wTech.innerHTML=m?(esc(m.streaminfo.sample_rate/1000+" kHz / "+m.streaminfo.bits+"-BIT / "+(m.streaminfo.channels===2?"STEREO":m.streaminfo.channels+"CH")+" / "+(m.format||"FLAC").toUpperCase())+
    ' <span class="badge '+(m.lossless===false?"lossy":"lossless")+'">'+(m.lossless===false?"LOSSY":"LOSSLESS")+"</span>"):"\u2014";
  const showTech=window.getCfg?window.getCfg("tech")!==false:true;
  WID.wTech.style.display=showTech?"":"none";
}
function paintState(){
  WID.wIcoPlay.style.display=S.playing?"none":"block";
  WID.wIcoPause.style.display=S.playing?"block":"none";
  WID.wShuf.classList.toggle("on",S.shuffle);
  WID.wRep.classList.toggle("on",S.repeat!=="off");
  WID.wPin.classList.toggle("on",S.pinned);
  /* live clock */
  WID.wTime.textContent=fmt(S.pos)+" / "+fmt(S.dur);
  /* vol leds/gel fill */
  const vb=WID.wVol;
  if(vb){
    const leds=vb.querySelector(".vol-leds");
    if(leds){
      const g=leds.getContext("2d");
      if(g){
        fitCanvas(leds);
        const Wc=leds.width,Hc=leds.height;
        g.clearRect(0,0,Wc,Hc);
        const n=Math.max(4,Math.floor(Wc/9));
        const segW=Math.max(3,Math.floor(Wc/n)-3);
        for(let i=0;i<n;i++){
          g.fillStyle=(S.vol>=(i+1)/n-.01)?css(ACC.cur,.95):css(themeCanvas.off,.9);
          g.fillRect(i*(segW+3),1,segW,Hc-2);
        }
      }
    }
    const gel=vb.querySelector(".vol-gel");
    if(gel)vb.style.setProperty("--val",(S.vol*100).toFixed(1)+"%");
  }
}
function paintLyricsStatus(){
  if(S.lyrics.length){
    WID.wLyrStatus.innerHTML='<span class="badge lossless">'+(S._lyricsSynced===false?"PLAIN":"SYNCED")+"</span>";
    WID.wLyrView.style.display="";
  }else if(S.lyricsStatus==="searching"){
    WID.wLyrStatus.innerHTML='<span class="h-caps mono">SEARCHING\u2026</span>';
    WID.wLyrView.style.display="";
  }else{
    WID.wLyrStatus.innerHTML='<span class="h-caps mono">NO LYRICS</span> <button class="btn" id="wLrcRetry">RETRY</button>';
    const b=document.getElementById("wLrcRetry");
    if(b)b.onclick=()=>emitCmd({cmd:"lrcfetch",path:S.meta&&S.meta.path,artist:S.meta&&S.meta.artist,title:S.meta&&S.meta.title});
    WID.wLyrView.style.display="none";
  }
}
function buildLyrics(){
  const wrap=WID.lyrWrap;
  wrap.innerHTML="";
  if(S.lyrics.length){
    S.lyrics.forEach(l=>{
      const d=document.createElement("div");
      d.className="lyric-line";
      d.textContent=l.text||"";
      wrap.appendChild(d);
    });
  }else if(S.lyricsPlain){
    S.lyricsPlain.split(/\r?\n/).forEach(txt=>{
      const d=document.createElement("div");
      d.className="lyric-line";
      d.textContent=txt;
      wrap.appendChild(d);
    });
  }
}
function lyricFollow(){
  if(!S.lyrics.length)return;
  const view=WID.wLyrView;
  const wrap=WID.lyrWrap;
  const lines=[...wrap.children];
  if(!lines.length)return;
  const t=S.pos-((window.getCfg&&window.getCfg("lyricsOffset"))||0)/1000;
  let idx=-1;
  for(let k=0;k<lines.length;k++){if(t>=+lines[k].dataset.t)idx=k}
  lines.forEach((l,k)=>{l.classList.toggle("active",k===idx);l.classList.toggle("past",idx>=0&&k<idx)});
  if(idx>=0){
    const ln=lines[idx];
    const top=ln.offsetTop-view.clientHeight/2+ln.offsetHeight/2;
    view.scrollTo({top:Math.max(0,top),behavior:"smooth"});
  }
}

/* ============================================================
   RENDER LOOP (viewer): bars→seek leds, lyric follow, tick drift
   ============================================================ */
let rafPending=false;
function tickAccent(now){
  if(!ACC.anim)return;
  const p=clamp((now-ACC.t0)/500,0,1);
  for(let k=0;k<3;k++)ACC.cur[k]=ACC.from[k]+(ACC.to[k]-ACC.from[k])*p;
  if(p>=1)ACC.anim=false;
  requestRedraw();
}
function requestRedraw(){W._dirty=true}
window.requestRedraw=requestRedraw;
function loop(now){
  rafPending=false;
  if(document.hidden){if(!rafPending){rafPending=true;requestAnimationFrame(loop)};return}
  tickAccent(now);
  /* pos drift between ticks (viewer smoothing lives in smoothing.js) */
  S.pos=window.viewerSmoothTick?viewerSmoothTick():S.pos;
  paintState();
  /* seek bar: LED canvas or gel fill */
  const sk=WID.wSeek;
  const p=S.dur?clamp(S.pos/S.dur,0,1):0;
  const cv=sk.querySelector(".seek-led");
  if(cv&&getComputedStyle(cv).display!=="none"){
    drawSeekLed(cv,p);
  }
  const gel=sk.querySelector(".seek-gel");
  if(gel&&getComputedStyle(gel).display!=="none")sk.style.setProperty("--val",(p*100).toFixed(2)+"%");
  /* dither repaint when needed */
  if(W._dirty||ACC.anim){
    if(S._img&&WID.wDither.style.display!=="none")drawDither(WID.wDither,S._img);
    W._dirty=false;
  }
  lyricFollow();
  if(!rafPending){rafPending=true;requestAnimationFrame(loop)}
}
function drawSeekLed(cv,p){
  fitCanvas(cv);
  const g=cv.getContext("2d");if(!g)return;
  const Wc=cv.width,Hc=cv.height;
  g.clearRect(0,0,Wc,Hc);
  const segW=Math.max(3,Math.round(Wc/60));
  const gap=2;
  const n=Math.max(1,Math.floor(Wc/(segW+gap)));
  const litN=Math.floor(p*n);
  for(let i=0;i<n;i++){
    g.fillStyle=i<=litN?css(ACC.cur,.95):css(themeCanvas.off,.9);
    g.fillRect(i*(segW+gap),1,segW,Hc-2);
  }
  /* playhead ink marker */
  g.fillStyle=css(themeCanvas.ink,.9);
  g.fillRect(clamp(Math.round(p*Wc)-1,0,Wc-2),0,2,Hc);
}
requestAnimationFrame(loop);

/* ============================================================
   CONTROLS → halftone:cmd
   ============================================================ */
WID.wPlay.onclick=()=>emitCmd({cmd:"play"});
WID.wNext.onclick=()=>emitCmd({cmd:"next"});
WID.wPrev.onclick=()=>emitCmd({cmd:"prev"});
WID.wShuf.onclick=()=>emitCmd({cmd:"shuffle"});
WID.wRep.onclick=()=>emitCmd({cmd:"repeat"});
WID.wPin.onclick=()=>{window.setCfg&&window.setCfg("widgetPin",!S.pinned);emitCmd({cmd:"pin",v:!S.pinned})};
WID.wMain.onclick=async()=>{
  try{
    if(T&&T.window){
      const all=await T.window.getAllWindows();
      const main=all.find(w=>w.label==="main");
      if(main){await main.show();await main.setFocus()}
    }
  }catch(e){console.warn(e)}
};
/* widget close = REAL quit (load-bearing: main hide ≠ app exit) */
WID.wClose.onclick=async()=>{
  try{window.curWin&&window.curWin.destroy()}catch(e){console.warn(e)}
};
/* seek: pointer math via getBoundingClientRect (transform-aware) */
(function wireSeek(){
  const sk=WID.wSeek;
  const frac=e=>{
    const r=sk.getBoundingClientRect();
    return clamp((e.clientX-r.left)/Math.max(1,r.width),0,1);
  };
  sk.addEventListener("pointerdown",e=>{
    try{sk.setPointerCapture(e.pointerId)}catch(_){}
    W._drag=true;
  });
  sk.addEventListener("pointermove",e=>{if(W._drag)W._dragP=frac(e)});
  const end=()=>{
    if(!W._drag)return;
    emitCmd({cmd:"seek",t:(W._dragP!=null?W._dragP:frac(event))*(S.dur||0)});
    W._drag=false;W._dragP=null;
  };
  sk.addEventListener("pointerup",end);
  sk.addEventListener("pointercancel",end);
  sk.addEventListener("wheel",e=>{e.preventDefault();emitCmd({cmd:"nudge",d:e.deltaY<0?5:-5})},{passive:false});
})();
/* volume */
(function wireVol(){
  const vb=WID.wVol;
  const set=e=>{
    const leds=vb.querySelector(".vol-leds");
    const gel=vb.querySelector(".vol-gel");
    const target=leds&&getComputedStyle(leds).display!=="none"?leds:gel;
    if(!target)return;
    const r=target.getBoundingClientRect();
    emitCmd({cmd:"vol",v:clamp((e.clientX-r.left)/Math.max(1,r.width),0,1)});
  };
  let down=false;
  vb.addEventListener("pointerdown",e=>{down=true;try{vb.setPointerCapture(e.pointerId)}catch(_){}set(e)});
  vb.addEventListener("pointermove",e=>down&&set(e));
  vb.addEventListener("pointerup",()=>down=false);
  vb.addEventListener("pointercancel",()=>down=false);
})();
/* build the volume DOM (LED ladder or gel — rebuilt on theme switch) */
function buildVolDom(){
  const vb=WID.wVol;
  const style=themeVolStyle;
  if(vb._built===style)return;
  vb._built=style;
  vb.innerHTML="";
  if(style==="gel"){
    const wrap=document.createElement("div");wrap.className="vol-gel";
    wrap.innerHTML='<div class="track"><div class="fill"></div><div class="knob"></div></div>';
    vb.appendChild(wrap);
  }else{
    const cv=document.createElement("canvas");cv.className="vol-leds";
    vb.appendChild(cv);
  }
}
document.addEventListener("halftone:theme",()=>{buildVolDom();paintState()});
buildVolDom();

/* keyboard + wheel volume */
addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();emitCmd({cmd:"play"})}
});
addEventListener("wheel",e=>{
  if(e.target.closest(".lyr-view"))return;
  e.preventDefault();
  emitCmd({cmd:"vol",v:clamp(S.vol+(e.deltaY<0?.05:-.05),0,1)});
},{passive:false});

/* ============================================================
   WIDGET SHEET (⚙): presets + widget-scoped settings rows
   Rendered in the UNSCALED overlay layer.
   ============================================================ */
function openWidgetSheet(){
  const body=WID.wSheetBody;
  body.innerHTML="";
  const addRow=(label,fn)=>{const b=document.createElement("button");b.className="sheet-row";
    b.innerHTML='<span style="flex:1">'+label+"</span>";b.onclick=()=>{fn();closeSheet()};body.appendChild(b)};
  /* presets */
  const seg=document.createElement("div");seg.className="seg";seg.style.width="100%";
  [["card","CARD"],["strip","STRIP"],["square","SQUARE"],["lyrics","LYRICS"]].forEach(([v,l])=>{
    const b=document.createElement("button");b.textContent=l;b.classList.toggle("on",W.preset===v);
    b.style.flex="1";b.onclick=()=>{window.setCfg&&window.setCfg("widgetPreset",v);closeSheet()};
    seg.appendChild(b);
  });
  body.appendChild(seg);
  /* widget-scoped settings rows (generated from the schema) */
  const host=document.createElement("div");host.id="wSetHost";host.style.width="100%";
  body.appendChild(host);
  if(window.htSettings){
    window.htSettings.surface="widget";
    window.htSettings.render(host);
    window.htSettings.surface="widget";
  }
  /* quick toggles */
  const toggles=document.createElement("div");
  toggles.style.cssText="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px";
  const mk=(label,key,cur)=>{const b=document.createElement("button");b.className="pill"+(cur?" active":"");
    b.textContent=label;b.onclick=()=>{window.setCfg&&window.setCfg(key,!cur);closeSheet();openWidgetSheet()};return b};
  toggles.appendChild(mk("LYRICS","widgetLyrics",!!(window.getCfg&&window.getCfg("widgetLyrics"))));
  toggles.appendChild(mk("SEEK","widgetSeek",window.getCfg?window.getCfg("widgetSeek")!==false:true));
  toggles.appendChild(mk("PIN","widgetPin",S.pinned));
  body.appendChild(toggles);
  WID.wSheet.classList.add("open");
}
function closeSheet(){WID.wSheet.classList.remove("open")}
WID.wGear.onclick=e=>{e.stopPropagation();WID.wSheet.classList.contains("open")?closeSheet():openWidgetSheet()};
document.addEventListener("pointerdown",e=>{
  if(!WID.wSheet.classList.contains("open"))return;
  if(WID.wSheet.contains(e.target)||WID.wGear.contains(e.target))return;
  closeSheet();
});
/* right-click anywhere: preset picker + hide */
document.addEventListener("contextmenu",e=>{
  if(e.target.closest("input,select,.w-sheet"))return;
  e.preventDefault();
  openCtx(e.clientX,e.clientY,[
    {label:"PRESET: CARD",checked:W.preset==="card",onClick:()=>{window.setCfg&&window.setCfg("widgetPreset","card")}},
    {label:"PRESET: STRIP",checked:W.preset==="strip",onClick:()=>{window.setCfg&&window.setCfg("widgetPreset","strip")}},
    {label:"PRESET: SQUARE",checked:W.preset==="square",onClick:()=>{window.setCfg&&window.setCfg("widgetPreset","square")}},
    {label:"PRESET: LYRICS",checked:W.preset==="lyrics",onClick:()=>{window.setCfg&&window.setCfg("widgetPreset","lyrics")}},
    {sep:1},
    {label:"WIDGET SETTINGS\u2026",onClick:()=>openWidgetSheet()},
    {label:"HIDE WIDGET",onClick:()=>{try{window.curWin&&window.curWin.hide()}catch(_){}}},
  ]);
});
function openCtx(x,y,items){
  document.querySelectorAll(".menu.ctxroot").forEach(m=>m.remove());
  const m=document.createElement("div");
  m.className="menu ctxroot open";
  for(const it of items){
    if(it.sep){const s=document.createElement("div");s.className="menu-sep";m.appendChild(s);continue}
    const b=document.createElement("button");b.className="menu-item"+(it.checked?" on":"");
    b.innerHTML='<span class="ctxdot"></span>'+it.label;
    b.onclick=()=>{m.remove();it.onClick&&it.onClick()};
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r=m.getBoundingClientRect();
  m.style.left=clamp(x,4,innerWidth-r.width-4)+"px";
  m.style.top=clamp(y,4,innerHeight-r.height-4)+"px";
  setTimeout(()=>{
    const close=e=>{if(!m.contains(e.target)){m.remove();document.removeEventListener("pointerdown",close)}};
    document.addEventListener("pointerdown",close);
  },10);
}
window.openCtx=openCtx;

/* ============================================================
   SETTINGS-DIVEN WIDGET BEHAVIOUR
   ============================================================ */
function applyWidgetPreset(v){
  W.preset=["card","strip","square","lyrics"].includes(v)?v:"card";
  WID.stage.className="widget-stage wp-"+W.preset;
  /* base size differs per preset → re-fit */
  scheduleStage();
  /* lyrics pane visibility */
  const wantLyrics=W.preset==="lyrics"||(W.preset!=="strip"&&S.lyricsOpen);
  WID.wLyrHost.style.display=(W.preset==="strip")?"none":(wantLyrics?"flex":"none");
  requestRedraw();
}
window.applyWidgetPreset=applyWidgetPreset;
function applyWidgetOpacity(v){
  const st=WID.stage;
  st.style.setProperty("--panel-alpha",(v/100).toFixed(2));
  st.style.background="color-mix(in srgb,var(--panel-bg) "+Math.round(v)+"%,transparent)";
}
window.applyWidgetOpacity=applyWidgetOpacity;
function applyWidgetPin(v){
  try{window.curWin&&window.curWin.setAlwaysOnTop(!!v)}catch(e){console.warn(e)}
}
window.applyWidgetPin=applyWidgetPin;
function applyWidgetLyrics(v){
  S.lyricsOpen=!!v;
  if(W.preset!=="strip")WID.wLyrHost.style.display=v?"flex":"none";
}
window.applyWidgetLyrics=applyWidgetLyrics;
function applyWidgetSeek(v){WID.wSeek.style.display=v?"":"none"}
window.applyWidgetSeek=applyWidgetSeek;
function applyWidgetVol(v){WID.wVol.style.display=v?"":"none"}
window.applyWidgetVol=applyWidgetVol;
function updateSwitchAttrs(){
  WID.wSeek.setAttribute("data-seek",themeSeekStyle);
  WID.wVol.setAttribute("data-vol",themeVolStyle);
}

/* ============================================================
   TAURI EVENT WIRING
   ============================================================ */
listen("halftone:sync",e=>applySync(e.payload));
listen("halftone:tick",e=>{const p=e.payload||{};S.pos=p.pos!=null?p.pos:p.t;S.dur=p.dur||S.dur});
listen("halftone:bars",e=>{const b=e.payload&&e.payload.bars;if(b)for(let i=0;i<NBARS;i++)S._barsRcv[i]=b[i]||0});
listen("halftone:lib",e=>{refreshLib()});
async function refreshLib(){
  try{const r=await invoke("library_snapshot");if(r&&r.tracks)S.lib=r.tracks}catch(e){}
}
document.addEventListener("halftone:settings",e=>{
  /* settings changed in main (or here): re-apply widget-scoped ones */
  const st=e.detail&&e.detail.store;
  if(st){
    applyWidgetPreset(st.widgetPreset||"card");
    if(st.widgetScaleMode)W.scaleMode=st.widgetScaleMode;
    if(st.widgetScale)W.scalePct=st.widgetScale;
    applyWidgetOpacity(st.widgetBgOpacity!=null?st.widgetBgOpacity:92);
    scheduleStage();
  }
});
(async function boot(){
  /* settings first (schema apply fns need the DOM) */
  if(window.htSettings){
    await window.htSettings.ready();
    const st=window.htSettings.all()||{};
    W.scaleMode=st.widgetScaleMode||"fit";
    W.scalePct=st.widgetScale||100;
    applyWidgetPreset(st.widgetPreset||"card");
    applyWidgetOpacity(st.widgetBgOpacity!=null?st.widgetBgOpacity:92);
    if(st.widgetSeek===false)applyWidgetSeek(false);
    if(st.widgetVol===false)applyWidgetVol(false);
  }
  await refreshLib();
  /* announce: owner answers with authoritative sync */
  if(T&&T.event&&T.event.emit){try{T.event.emit("halftone:hello",{}).catch(()=>{})}catch(_){}}
  if(!S.meta)emitCmd({cmd:"hello"});
  applyStage();
})();
/* drag: whole stage moves the window (except controls) */
wireDrag(WID.stage);
/* resize → refit */
new ResizeObserver(scheduleStage).observe(document.documentElement);
</script>
