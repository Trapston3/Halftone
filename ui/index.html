<!doctype html>
<html lang="en" data-theme="analogue" data-mode="dark" data-motion="full" data-density="cozy" data-surface="widget">
<head>
<meta charset="utf-8">
<title>Halftone widget</title>
<script>window.IS_VIEWER=true;</script>
<script>
/* boot-error reporter: last uncaught error + stack into __HT_BOOT_ERR
   (read by the test harness; harmless in production) */
window.onerror=function(msg,src,line,col,err){
  window.__HT_BOOT_ERR={msg:String(msg),line:line,
    stack:err&&err.stack?String(err.stack).split("\n").slice(0,24).join("\n"):null};
  return false;
};
window.addEventListener("unhandledrejection",function(ev){
  var r=ev.reason;
  window.__HT_BOOT_ERR={msg:"unhandledrejection: "+(r&&r.message||String(r)),
    line:0,stack:r&&r.stack?String(r.stack).split("\n").slice(0,24).join("\n"):null};
});
</script>
<link rel="stylesheet" href="themes/base.css">
<link rel="stylesheet" href="themes/analogue.css">
<link rel="stylesheet" href="themes/digital.css">
<style>
/* ============ widget page styles ============ */
body{background:transparent;overflow:hidden}

/* ---------- STAGE: designed at logical size, scaled by --s.
   The stage FILLS the window (no letterbox): its logical size is
   innerWidth/s x innerHeight/s. Pointer math uses
   getBoundingClientRect (transform-aware) or the overlay layer. ---------- */
.widget-stage{
  position:fixed;left:0;top:0;transform-origin:0 0;z-index:1;
  display:flex;flex-direction:column;
  background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:calc(var(--R-w));
  /* NOTE was overflow:hidden — clipped the liquid-glass button glow
     (digital dark mode .btn-orb.lg has an 18-26px external box-shadow
     bloom) against the stage's own tight edges, producing a visible
     flat cut on the glow (owner bug: "buttons clipping on the widget").
     border-radius still clips the stage's OWN background/border (that
     is independent of overflow), so the rounded-card look is unchanged;
     only child overflow (glow/hover-scale) is no longer clamped here.
     Art (.w-art) and the lyrics scroll view keep their own
     overflow:hidden/auto, so nothing that needs clipping loses it. */
  overflow:visible;
}
.w-head{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp3);min-height:0}
.w-artwrap{position:relative;flex:none}
.w-art{width:96px;height:96px;border-radius:var(--R-m);border:1px solid var(--line-2);
  background:var(--canvas-bg);display:block;object-fit:cover;overflow:hidden;position:relative}
.w-art canvas,.w-art img{width:100%;height:100%;display:block;object-fit:cover}
.w-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.w-title{font-size:1rem;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-artist{font-size:.6875rem;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-tech{font-size:.5625rem;color:var(--fg-3);font-family:var(--font-mono);letter-spacing:.08em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-tech .badge{margin-left:4px;vertical-align:1px}
.w-actions{display:flex;gap:4px;margin-left:auto;flex:none}
/* header quick actions: 22px visual, but the hit area stays >=32px via
   a transparent ::after overlay (audit fix — tiny targets were missed taps) */
.w-actions .btn-icon{width:22px;height:22px;position:relative}
.w-actions .btn-icon::after{content:"";position:absolute;inset:-5px}
.w-actions .btn-icon svg{width:12px;height:12px}
.w-gear{position:absolute;right:6px;top:6px;opacity:.5;transition:opacity var(--dur-1)}
.w-gear:hover{opacity:1}
.w-transport{display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3) var(--sp3)}
.w-transport .btn-orb{width:34px;height:34px}
.w-transport .btn-orb.lg{width:42px;height:42px}
.w-transport .btn-orb svg{width:14px;height:14px}
.w-transport .btn-orb.lg svg{width:17px;height:17px}
.w-time{font-size:.625rem;color:var(--fg-3);font-family:var(--font-mono);font-variant-numeric:tabular-nums;min-width:76px}
/* ============ LYRICS LAYOUT (widget) ============
   The stage is a SIZE CONTAINER: lyric type is sized in cqh/cqw so it
   scales with the widget's own LOGICAL size — in fit mode (stage logical
   size follows the window) and in fixed-scale mode (where a 70% stage
   has a much larger logical area than a 200% one). Font sizes stay
   fluid per preset via --lyr-fs; base.css .lyric-line consumes it. */
.widget-stage{container-type:size;container-name:stage}
.w-lyrics-host{flex:1;min-height:0;padding:0 var(--sp3) var(--sp3);display:flex}
.widget-lyrics{flex:1;min-height:0;display:flex;flex-direction:column}
.widget-lyrics .lyr-status{flex:none;display:flex;gap:var(--sp2);align-items:center;
  min-height:16px;padding:0 var(--sp1) 4px}
.widget-lyrics .lyr-status .btn{padding:2px 8px;font-size:.5625rem}
/* real scroll container: the view is a plain flex child (NOT absolutely
   positioned — the old inset:0 overlay painted the lyrics ON TOP of the
   status row and never gave the host a height). Hidden-but-styled
   scrollbar, contained overscroll. */
.widget-lyrics .lyr-view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:0 var(--sp2);
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
  -webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);
          mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.widget-lyrics .lyr-view::-webkit-scrollbar{width:8px}
.widget-lyrics .lyr-view::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.widget-lyrics .lyr-view::-webkit-scrollbar-track{background:transparent}
/* wrap grows to fill when the list is short (vertically centred hero
   block) and scrolls normally when it is long; no %-of-width padding
   hack (the old padding-bottom:40% reserved a WIDTH-proportional slab
   that had nothing to do with available height) */
.widget-lyrics .lyr-wrap{flex:1 0 auto;display:flex;flex-direction:column;
  justify-content:center;padding:6px 0}
/* type scale: ~5% of stage height for strip-in-card presets,
   ~7.5% for the lyrics hero, clamped to readable bounds.
   --lyr-fs lives on the pane so the scroll view can floor its own
   height in the same units (over-zoomed fixed mode keeps ~2 lines). */
.widget-lyrics{--lyr-fs:clamp(0.72rem,5cqh,1.9rem)}
.widget-stage.wp-lyrics .widget-lyrics{--lyr-fs:clamp(0.95rem,7.4cqh,2.6rem)}
.widget-lyrics .lyr-view{min-height:calc(var(--lyr-fs,1rem)*4.4)}
/* theme files set fixed px lyric sizes for the main window
   (:root[data-theme="…"] .lyrics .lyric-line = specificity 0,4,0; the
   digital dark-mode variant even 0,5,0/0,6,0). This block re-points them
   at the fluid var with HIGHER specificity (:root[data-theme] prefix →
   0,5,0 / 0,6,0; ties beat the theme because this inline block comes
   after the theme <link>s), or the fixed 26px/24px(+32px active)
   hardcode would override --lyr-fs in the widget (owner bug 1). */
:root[data-theme] .widget-lyrics .lyr-wrap .lyric-line{font-size:var(--lyr-fs,1.75rem)}
:root[data-theme] .widget-lyrics .lyr-wrap .lyric-line.active{font-size:calc(var(--lyr-fs,1.75rem)*1.12)}
:root[data-theme] .widget-stage.wp-lyrics .widget-lyrics .lyr-wrap .lyric-line.active{font-size:calc(var(--lyr-fs,1.75rem)*1.18)}

/* presets */
.widget-stage.wp-card{--w-base-w:380;--w-base-h:260}
.widget-stage.wp-strip{--w-base-w:380;--w-base-h:132;
  justify-content:center}   /* nothing flex-grows in strip: centre the stack in big windows */
/* strip: compact single-column stack that actually fits —
   small art, slim rows, hidden vol, transport inline with time */
.widget-stage.wp-strip .w-head{padding:8px 10px 4px;gap:10px;align-items:center}
.widget-stage.wp-strip .w-art{width:44px;height:44px}
.widget-stage.wp-strip .w-title{font-size:.8125rem}
.widget-stage.wp-strip .w-artist{font-size:.625rem}
.widget-stage.wp-strip .w-meta{gap:1px}
.widget-stage.wp-strip .w-time{min-width:0;font-size:.5625rem}
.widget-stage.wp-strip .w-actions{gap:2px}
.widget-stage.wp-strip .w-actions .btn-icon{width:20px;height:20px}
.widget-stage.wp-strip .w-actions .btn-icon::after{inset:-6px}
.widget-stage.wp-strip .w-seek{margin:0 10px}
.widget-stage.wp-strip .w-transport{gap:6px;padding:2px 10px 8px}
.widget-stage.wp-strip .btn-orb{width:28px;height:28px}
.widget-stage.wp-strip .btn-orb.lg{width:34px;height:34px}
.widget-stage.wp-strip .btn-orb svg{width:12px;height:12px}
.widget-stage.wp-strip .btn-orb.lg svg{width:14px;height:14px}
.widget-stage.wp-strip .vol{display:none}
.widget-stage.wp-strip .w-lyrics-host{display:none}
.widget-stage.wp-strip .w-tech{display:none}
.widget-stage.wp-square{--w-base-w:300;--w-base-h:400}
/* square: the art can NOT be a fixed 100%-width block (it grew with the
   window and shoved title/transport/lyrics off-screen). Instead the
   artwrap is a flex peer of the lyrics pane: fixed chrome first, then
   art and pane SHARE what is left — art floored at 72px so the preset
   keeps its identity, pane yielding rather than overlapping. Tall
   windows give the big square art back. */
.widget-stage.wp-square .w-artwrap{flex:1 1 0;min-height:72px;width:100%;
  display:flex;justify-content:center;align-items:stretch;
  /* clip the art box itself here (its aspect-ratio can overflow the
     column during flex sizing) instead of on .w-head below — w-head's
     own overflow:hidden also clipped .w-actions' button glow (same
     class of bug as the stage-level fix above), and the art needs
     containment but the actions row does not. */
  overflow:hidden}
.widget-stage.wp-square .w-art{width:auto;height:100%;aspect-ratio:1;max-width:100%}
.widget-stage.wp-square .w-head{flex-direction:column;flex:1;min-height:0}
.widget-stage.wp-square .w-meta{padding-top:0;flex:none}
.widget-stage.wp-square .w-actions{flex:none;margin-left:0;align-self:flex-end}
.widget-stage.wp-square .widget-lyrics .lyr-view{min-height:0}
.widget-stage.wp-lyrics{--w-base-w:380;--w-base-h:300}
/* lyrics hero: art gone, head + transport collapse to slim rows so the
   pane is the hero; centre the active line by giving the scroll view
   generous top/bottom padding (wrap centers when short, scrolls when long) */
.widget-stage.wp-lyrics .w-artwrap{display:none}
.widget-stage.wp-lyrics .w-head{padding:var(--sp2) var(--sp3) 0}
.widget-stage.wp-lyrics .w-transport{padding-bottom:var(--sp2)}
.widget-stage.wp-lyrics .w-lyrics-host{display:flex;padding:0 var(--sp3)}
/* NOTE: no %-of-height padding inside the scroll view here — the wrap
   centres itself via flex when it fits, and widget.js instantly centres
   the active line after a lyrics rebuild; extra padding double-counted
   and pushed the active line below the fold. */
/* lyric rhythm: theme files own colour/type treatment; the widget owns
   spacing so inactive lines read as context around the active one */
.widget-lyrics .lyr-wrap .lyric-line{padding:.32em 0}
/* hit area: lines can be small at strip scale — keep the CLICK target
   >=32px tall without changing the visual rhythm */
.widget-lyrics .lyr-wrap .lyric-line{position:relative}
.widget-lyrics .lyr-wrap .lyric-line::after{content:"";position:absolute;left:0;right:0;
  top:50%;height:max(100%,32px);transform:translateY(-50%)}

/* un-scaled overlay: menus/sheets/tooltips live here (never divide by a zoom factor) */
.w-overlay{position:fixed;inset:0;z-index:50;pointer-events:none}
.w-overlay>*{pointer-events:auto}
.w-sheet{position:fixed;right:8px;top:8px;min-width:210px;max-width:calc(100vw - 16px);
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--R-m);
  box-shadow:var(--shadow-2);padding:5px;display:none;backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat))}
.w-sheet.open{display:block;animation:menuin var(--dur-1) var(--ease-out)}
#htToasts{z-index:80}
</style>
</head>
<body data-surface="widget">
<div class="widget-stage wp-card" id="stage">
  <div class="w-head">
    <div class="w-artwrap">
      <div class="w-art art-swap-host" id="wArt">
        <img id="wCover" alt="cover art">
        <canvas class="art-dither" id="wDither"></canvas>
      </div>
    </div>
    <div class="w-meta">
      <div class="w-title" id="wTitle">&#8212;</div>
      <div class="w-artist" id="wArtist">&#8212;</div>
      <div class="w-tech" id="wTech"></div>
      <div style="flex:1"></div>
      <div class="w-time mono" id="wTime">00:00 / 00:00</div>
    </div>
    <div class="w-actions">
      <button class="btn-icon" id="wGear" title="Widget settings" aria-label="Widget settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
      </button>
      <button class="btn-icon" id="wPin" title="Always on top" aria-label="Always on top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z"/></svg>
      </button>
      <button class="btn-icon" id="wMain" title="Open main window" aria-label="Open main window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      </button>
      <button class="btn-icon" id="wClose" title="Quit Halftone" aria-label="Quit Halftone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="seek w-seek" id="wSeek" style="margin:0 var(--sp3);flex:none">
    <canvas class="seek-led"></canvas>
    <div class="seek-gel"><div class="track"><canvas class="gel-bars" width="0" height="0"></canvas><div class="fill"></div><div class="knob"></div></div></div>
    <div class="seek-tip mono">00:00</div>
  </div>
  <div class="w-transport">
    <div class="vol" id="wVol"></div>
    <span style="flex:1"></span>
    <button class="btn-orb" id="wPrev" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6z"/><path d="M20 5.4v13.2c0 .8-.9 1.3-1.6.9L9.5 12.7a1 1 0 0 1 0-1.7l8.9-5.9c.7-.4 1.6.1 1.6.9z"/></svg>
    </button>
    <button class="btn-orb lg" id="wPlay" title="Play / pause">
      <svg id="wIcoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8a1 1 0 0 0 0-1.7L9.8 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
      <svg id="wIcoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
    </button>
    <button class="btn-orb" id="wNext" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.4v13.2c0 .8.9 1.3 1.6.9l8.9-5.8a1 1 0 0 0 0-1.7L5.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>
    </button>
    <span style="flex:1"></span>
    <button class="btn-icon" id="wShuf" title="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7.5 7.5"/><path d="M3 21l7.5-7.5"/><path d="M16 21h5v-5"/><path d="M15 15l6 6"/><path d="M3 3l6 6"/></svg>
    </button>
    <button class="btn-icon" id="wRep" title="Repeat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>
  <div class="w-lyrics-host" id="wLyrHost" style="display:none">
    <div class="widget-lyrics lyrics">
      <div class="lyr-status" id="wLyrStatus"></div>
      <div class="lyr-view" id="wLyrView"><div class="lyr-wrap mono" id="lyrWrap"></div></div>
    </div>
  </div>
</div>

<!-- un-scaled overlay layer: menus / sheets / toasts -->
<div class="w-overlay" id="wOverlay">
  <div class="w-sheet" id="wSheet">
    <div class="sheet-head"><div class="h1" style="font-size:.75rem" id="wSheetTitle">WIDGET</div></div>
    <div id="wSheetBody" class="sheet-body" style="display:flex;flex-direction:column;gap:2px"></div>
  </div>
</div>

<script src="test/loader.js"></script>
<script src="common.js"></script>
<script src="smoothing.js"></script>
<script>try{wireLyrScroll(document)}catch(e){console.warn(e)}</script>
<script src="theme.js"></script>
<script src="settings.js"></script>
<script src="widget.js"></script>
</body>
</html>
