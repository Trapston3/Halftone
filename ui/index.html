<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halftone</title>
<link rel="stylesheet" href="style.css">
<style>
/* ============ widget shell ============ */
body{background:transparent}
.widget{
  position:fixed;inset:0;border-radius:var(--r-w);
  background:var(--bg);
  border:1px solid var(--accent);        /* album-themed edge: accent frame */
  display:flex;flex-direction:column;
  overflow:visible;
}
.widget-body{
  position:relative;border-radius:calc(var(--r-w) - 1px);overflow:hidden;
  display:flex;flex-direction:column;flex:1;background:var(--bg);
}
/* perimeter dither band — the album's own edge, halftoned in accent */
#edgeCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

.head{display:flex;gap:var(--sp3);padding:var(--sp3);cursor:grab}
.head:active{cursor:grabbing}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column;pointer-events:none}
.trk-no{font-size:10px;letter-spacing:.18em;color:var(--accent)}
.title{margin-top:var(--sp1);font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech{margin-top:var(--sp1);font-size:10px;letter-spacing:.1em;color:var(--dim2)}
.tools{margin-top:auto;display:flex;gap:var(--sp1);pointer-events:auto}

/* window control buttons */
.winctl{display:flex;gap:var(--sp1);position:absolute;top:var(--sp3);right:var(--sp3);z-index:30;pointer-events:auto}
.winctl .tbtn{border-radius:var(--r-m)}

/* cover sizes — cfg.cover small/large; realart = un-dithered photo */
canvas.art,.art{width:96px;height:96px;border-radius:var(--r-b);border:1px solid var(--line);display:block;background:#12171A}
.artwrap img.art{object-fit:cover}
.artwrap{flex:none}
.art.large{width:128px;height:128px}

/* lyrics zone */
.lyrics{overflow:hidden;max-height:0;transition:max-height .45s cubic-bezier(.2,.9,.2,1)}
.lyrics.open{max-height:168px}
.lyr-view{
  height:168px;overflow:hidden;padding:0 var(--sp4);
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
          mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
}
.lyr-wrap{transform:translateY(64px);transition:transform .5s cubic-bezier(.25,.9,.2,1)}
.line{padding:6px 0;font-size:12px;line-height:1.5;color:rgba(242,232,207,.38);transition:color .25s ease;cursor:pointer}
.line:hover{color:rgba(242,232,207,.7)}
.line.active{color:var(--cream)}
.line.active::before{content:"\25B8  ";color:var(--accent)}

/* no-lrc hint inside the lyrics panel */
.lrc-hint{
  height:168px;display:none;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:var(--sp2);padding:0 var(--sp4);
}
.lrc-hint.show{display:flex}
.lrc-hint .h-caps{color:var(--dim2)}
.lrc-hint .msg{font-size:11px;color:var(--dim);line-height:1.6}
.lrc-hint a{
  font-size:10px;letter-spacing:.14em;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent);border-radius:var(--r-l);padding:6px 12px;font-family:var(--mono);
}
.lrc-hint a:hover{background:var(--accent-12)}

/* transport row */
.controls{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3);margin-top:auto}
.vol{margin-left:auto;display:flex;align-items:center;gap:var(--sp2)}
.vol svg{width:14px;height:14px;color:var(--dim)}

.lrc-btn-dot{position:absolute;left:5px;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.lrc-available .lrc-btn-dot{opacity:1}

/* ---- queue: popover presentation (cfg.queueSide=false) ---- */
#queue{left:auto;right:var(--sp3);top:56px;width:300px}
#queue .libsec{margin-top:var(--sp2)}

/* ---- queue: side drawer presentation (cfg.queueSide=true) ---- */
#queue.qdrawer{
  position:absolute;left:auto;right:0;top:0;bottom:0;width:256px;
  display:flex;flex-direction:column;
  border:1px solid var(--line2);border-right:0;border-radius:var(--r-w) 0 0 var(--r-w);
  box-shadow:var(--e-pop);
  visibility:hidden;transform:translateX(100%);
  transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility .32s;
}
#queue.qdrawer.open{visibility:visible;transform:none}
#queue.qdrawer .qscroll{flex:1;min-height:0;max-height:none;overflow-y:auto}
#queue.qdrawer .libsec{border-top:1px solid var(--line);padding-top:var(--sp2);margin-top:0}

.qscroll{max-height:150px;overflow-y:auto}
.librow{display:flex;gap:var(--sp1)}
.librow input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);
  color:var(--cream);font:11px var(--mono);padding:6px 8px;
}
.librow input:focus{outline:none;border-color:var(--accent)}
.librow button{padding:6px 12px;border:1px solid var(--line2);border-radius:var(--r-l);font-size:10px;letter-spacing:.14em;color:var(--cream)}
.librow button:hover{border-color:var(--accent);color:var(--accent)}
.libstat{margin-top:var(--sp2);font-size:10px;letter-spacing:.1em;color:var(--dim2);font-family:var(--mono)}
</style>
</head>
<body class="scanlines">
<div class="widget" id="widget">
  <div class="winctl">
    <button class="tbtn" id="btnMax" data-tip="EXPAND &#183; FULL PLAYER" aria-label="Expand to full player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
    </button>
    <button class="tbtn danger" id="btnClose" data-tip="CLOSE WIDGET" aria-label="Close widget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="widget-body" id="wbody">
    <canvas id="edgeCv"></canvas>

    <div class="head" id="head">
      <div class="artwrap">
        <img class="art" id="artImg" alt="cover art" style="display:none">
        <canvas class="art" id="artCv"></canvas>
      </div>
      <div class="hmeta">
        <div class="trk-no mono" id="trkNo">HALFTONE / NO LIBRARY</div>
        <div class="title" id="tTitle">scan a folder to begin</div>
        <div class="tech mono" id="tTech">DIRECT FLAC / NO TRANSCODE</div>
        <div class="tools">
          <button class="tbtn" id="btnLyrics" data-tip="LYRICS &#183; SYNCED" aria-label="Synced lyrics toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="16.5" cy="15" r="2.3"/></svg>
            <span class="lrc-btn-dot"></span>
          </button>
          <button class="tbtn" id="btnQueue" data-tip="QUEUE &#183; LIBRARY" aria-label="Queue / library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h16M4 16h7"/><path d="M14 14.5l6 2.5-6 2.5z" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="seekwrap">
      <div class="seek" id="seek">
        <canvas id="seekCv"></canvas>
        <div class="tip mono" id="tip">00:00 / 00:00</div>
      </div>
      <div class="times mono"><span id="tCur">00:00</span><span id="tTot">00:00</span></div>
    </div>

    <div class="controls">
      <button class="cbtn" id="btnPrev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6z"/><path d="M20 5.4v13.2c0 .8-.9 1.3-1.6.9L9.5 12.7a1 1 0 0 1 0-1.7l8.9-5.9c.7-.4 1.6.1 1.6.9z"/></svg>
      </button>
      <button class="cbtn play" id="btnPlay" title="Play / pause">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8a1 1 0 0 0 0-1.7L9.8 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
      </button>
      <button class="cbtn" id="btnNext" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.4v13.2c0 .8.9 1.3 1.6.9l8.9-5.8a1 1 0 0 0 0-1.7L5.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>
      </button>
      <button class="tbtn" id="btnShuf" data-tip="SHUFFLE" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7.5 7.5"/><path d="M3 21l7.5-7.5"/><path d="M16 21h5v-5"/><path d="M15 15l6 6"/><path d="M3 3l6 6"/></svg>
      </button>
      <button class="tbtn" id="btnRep" data-tip="REPEAT" aria-label="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        <span class="r1">1</span>
      </button>
      <div class="vol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/></svg>
        <div class="leds" id="leds" role="slider" aria-label="Volume" tabindex="0"></div>
      </div>
    </div>

    <div class="lyrics" id="lyrics">
      <div class="lyr-view"><div class="lyr-wrap mono" id="lyrWrap"></div></div>
      <div class="lrc-hint" id="lrcHint">
        <div class="h-caps mono">LYRICS</div>
        <div class="msg">No .lrc file found for this track.<br>
          Halftone reads a synced .lrc sidecar next to the FLAC.</div>
        <a href="#" id="lrcGet">GET SYNCED LYRICS &#183; LRCLIB.NET</a>
      </div>
    </div>
  </div>

  <div class="pop" id="queue">
    <div class="cap mono">QUEUE / LIBRARY</div>
    <div class="qscroll" id="qrows"></div>
    <div class="libsec">
      <div class="cap mono">LIBRARY FOLDER</div>
      <div class="librow">
        <input id="libpath" type="text" spellcheck="false" placeholder="C:\Users\you\Music">
        <button id="libscan" class="mono">SCAN</button>
      </div>
      <div class="libstat mono" id="libstat">no scan yet</div>
    </div>
  </div>
</div>

<audio id="aud" preload="metadata" crossorigin="anonymous"></audio>
<script src="common.js"></script>
<script>
/* ============ widget page wiring ============ */
["widget","wbody","head","edgeCv","artCv","artImg","trkNo","tTitle","tTech","seek","seekCv","tip","tCur","tTot",
 "lyrics","lyrWrap","lrcHint","lrcGet","qrows","queue","libpath","libscan","libstat","leds",
 "icoPlay","icoPause","btnPlay","btnLyrics","btnQueue","btnShuf","btnRep","btnPrev","btnNext",
 "btnMax","btnClose","aud"].forEach(k=>el[k]=document.getElementById(k));
wireSeek(el.seek);
wireDrag(el.wbody);

const COV_D=32,LYR_D=172;
const artSize=()=>S.cfg.cover==="large"?128:96;

/* height management: deltas only, so a user resize is never clobbered */
async function shiftH(d){
  if(!curWin||!d)return;
  try{
    const sf=await curWin.scaleFactor(),s=await curWin.innerSize();
    await curWin.setSize(new T.window.LogicalSize(s.width/sf,s.height/sf+d));
  }catch(e){console.warn("size",e)}
}

/* ============ layout config (right-click configurator target) ============ */
function applyCfg(){
  el.artCv.classList.toggle("large",S.cfg.cover==="large");
  el.artImg.classList.toggle("large",S.cfg.cover==="large");
  el.tTech.style.display=S.cfg.tech?"":"none";
  el.queue.classList.toggle("qdrawer",!!S.cfg.queueSide);
  drawCover();drawEdge(el.edgeCv,S._img);
}
function drawCover(){
  if(S.cfg.art==="real"&&S._img){
    el.artImg.src=artSrc();el.artImg.style.display="";el.artCv.style.display="none";
  }else{
    el.artImg.style.display="none";el.artCv.style.display="";
    drawDither(el.artCv,S._img);
  }
}
function setCfg(k,v){
  const before=S.cfg[k];
  S.cfg[k]=v;saveStore();
  if(k==="cover"&&before!==v)shiftH(v==="large"?COV_D:-COV_D);
  applyCfg();
}

/* ============ lyrics toggle ============ */
async function setLyricsOpen(open){
  S.lyricsOpen=open;
  el.lyrics.classList.toggle("open",open);
  el.btnLyrics.classList.toggle("on",open);
  el.btnLyrics.classList.toggle("lrc-available",S.lyrics.length>0);
  await shiftH(open?LYR_D:-LYR_D);
  if(open){
    if(S.lyrics.length){el.lrcHint.classList.remove("show");S.lidx=-1;updateLyrics()}
    else{el.lrcHint.classList.add("show")}
  }
  saveStore();
}
el.btnLyrics.onclick=()=>setLyricsOpen(!S.lyricsOpen);
el.lrcGet.onclick=async e=>{
  e.preventDefault();
  const t=trk()||{title:"",artist:""};
  const url="https://lrclib.net/search?q="+encodeURIComponent(t.artist+" "+t.title);
  try{await invoke("plugin:openExternal|open",{url})}catch(err){
    try{await invoke("opener:open_url",{url})}catch(e2){console.warn(e2)}}
};

/* ============ queue / library ============ */
function buildQueue(){el.qrows.innerHTML="";
  S.lib.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="prow"+(i===S.i?" cur":"");
    b.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${t.title}</span><span class="d">${fmt(t.duration_s)}</span>`;
    b.onclick=()=>{loadTrack(i);el.queue.classList.remove("open")};
    el.qrows.appendChild(b)});
}
el.btnQueue.onclick=e=>{e.stopPropagation();el.queue.classList.toggle("open");buildQueue()};
document.addEventListener("click",e=>{
  if(!el.queue.contains(e.target)&&!el.btnQueue.contains(e.target))el.queue.classList.remove("open");
});
el.libscan.onclick=()=>scanLibrary(el.libpath.value.trim()).then(()=>{buildQueue();el.tTitle.textContent=S.lib.length?S.lib[0].title:"no tracks"});
el.libpath.addEventListener("keydown",e=>{if(e.key==="Enter")el.libscan.click()});

/* ============ right-click configurator (submenu structure) ============ */
el.widget.addEventListener("contextmenu",e=>{
  if(e.target.closest("input"))return;
  e.preventDefault();
  openCtx(e.clientX,e.clientY,[
    {label:S.pinned?"UNPIN":"PIN ALWAYS-ON-TOP",checked:S.pinned,onClick:togglePin},
    {label:"EXPAND \u00B7 FULL PLAYER",onClick:()=>el.btnMax.click()},
    {label:"QUEUE AS SIDE DRAWER",checked:!!S.cfg.queueSide,onClick:()=>setCfg("queueSide",true)},
    {label:"QUEUE AS POPOVER",checked:!S.cfg.queueSide,onClick:()=>setCfg("queueSide",false)},
    {sep:1},
    {label:"LAYOUT",children:[
      {label:"COVER \u00B7 SMALL",checked:S.cfg.cover!=="large",onClick:()=>setCfg("cover","small")},
      {label:"COVER \u00B7 LARGE",checked:S.cfg.cover==="large",onClick:()=>setCfg("cover","large")},
      {sep:1},
      {label:"TECH ROW",checked:S.cfg.tech,onClick:()=>setCfg("tech",!S.cfg.tech)},
    ]},
    {label:"DITHER",children:[
      {label:"DENSITY \u00B7 STANDARD",checked:S.cfg.grid===32,onClick:()=>setCfg("grid",32)},
      {label:"DENSITY \u00B7 FINE",checked:S.cfg.grid===48,onClick:()=>setCfg("grid",48)},
      {label:"DENSITY \u00B7 ULTRA",checked:S.cfg.grid===64,onClick:()=>setCfg("grid",64)},
      {sep:1},
      {label:"ALBUM ART \u00B7 DITHER",checked:S.cfg.art!=="real",onClick:()=>setCfg("art","dither")},
      {label:"ALBUM ART \u00B7 REAL PHOTO",checked:S.cfg.art==="real",onClick:()=>setCfg("art","real")},
    ]},
  ]);
});

/* ============ window controls ============ */
/* NOTE: the withGlobalTauri bundle exposes T.window.getAllWindows
   but NOT WebviewWindow — getByLabel throws here. Look up by label. */
async function winByLabel(label){
  try{const all=await T.window.getAllWindows();return all.find(w=>w.label===label)||null}
  catch(e){console.warn(e);return null}
}
el.btnClose.onclick=async()=>{
  /* closing the widget ends the app: destroy hidden main first */
  const main=await winByLabel("main");
  try{if(main)await main.destroy()}catch(e){console.warn(e)}
  try{await curWin.close()}catch(e){console.warn(e)}
};
el.btnMax.onclick=async()=>{
  try{
    let main=await winByLabel("main");
    if(!main){
      try{
        await invoke("plugin:webview|create_webview_window",{label:"main",options:{
          url:"main.html?view=nowplaying&track="+S.i,title:"Halftone",center:true,
          width:1200,height:760,minWidth:960,minHeight:620,
          decorations:false,resizable:true,shadow:false,transparent:true}});
        main=await winByLabel("main");
      }catch(e2){console.warn("create main",e2)}
    }
    if(main){
      try{await main.emit("halftone:open-np",{track:S.i})}catch(_){}  /* no-op if not listening yet */
      await main.show();await main.setFocus();
    }
  }catch(e){console.warn("open main",e)}
};

/* pin via double-click on background */
el.wbody.addEventListener("dblclick",e=>{
  if(e.target.closest("button,input,a,.seek,.leds,.lyr-view,.pop"))return;
  togglePin();
});
async function togglePin(){
  S.pinned=!S.pinned;
  try{await curWin.setAlwaysOnTop(S.pinned)}catch(e){console.warn(e)}
  document.title=S.pinned?"pinned":"";
  saveStore();
}

/* transport */
el.btnPlay.onclick=()=>setPlaying(!S.playing);
el.btnNext.onclick=()=>nextTrack();
el.btnPrev.onclick=()=>{if(!S.lib.length)return;
  if(el.aud.currentTime>3)el.aud.currentTime=0;else loadTrack(S.i-1)};
el.aud.addEventListener("ended",()=>nextTrack(true));
el.aud.addEventListener("timeupdate",()=>{el.tCur.textContent=fmt(el.aud.currentTime)});
function updTransport(){
  el.btnShuf.classList.toggle("on",S.shuffle);
  el.btnRep.classList.toggle("on",S.repeat!=="off");
  el.btnRep.classList.toggle("rep-one",S.repeat==="one");
}
el.btnShuf.onclick=()=>{S.shuffle=!S.shuffle;saveStore();updTransport()};
el.btnRep.onclick=()=>{cycleRepeat();updTransport()};
document.addEventListener("halftone:state",updTransport);
updTransport();

/* volume */
const LEDN=5,leds=[];
for(let i=0;i<LEDN;i++){
  const d=document.createElement("div");d.className="led";
  d.onclick=()=>{S.vol=(i+1)/LEDN;paintLeds();el.aud.volume=S.vol;if(gainNode)gainNode.gain.value=S.vol;saveStore()};
  el.leds.appendChild(d);leds.push(d)}
function paintLeds(){leds.forEach((l,i)=>l.classList.toggle("on",S.vol>=(i+1)/LEDN-.01))}
paintLeds();el.aud.volume=S.vol;
el.leds.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){S.vol=Math.min(1,S.vol+1/LEDN)}
  if(e.key==="ArrowLeft"){S.vol=Math.max(0,S.vol-1/LEDN)}
  paintLeds();el.aud.volume=S.vol;if(gainNode)gainNode.gain.value=S.vol;saveStore()});

/* tooltips */
document.querySelectorAll(".tbtn[data-tip]").forEach(b=>{
  b.addEventListener("pointerenter",()=>b.classList.add("tip-on"));
  b.addEventListener("pointerleave",()=>b.classList.remove("tip-on"));
  b.addEventListener("click",()=>b.classList.remove("tip-on"));
});

/* keyboard */
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();el.btnPlay.click()}
  if(e.code==="ArrowRight"&&el.aud.duration)el.aud.currentTime=Math.min(el.aud.duration,el.aud.currentTime+5);
  if(e.code==="ArrowLeft")el.aud.currentTime=Math.max(0,el.aud.currentTime-5);
});

/* render loop */
function loop(now){
  const tinted=tickAccent(now);
  if(tinted){drawCover();drawEdge(el.edgeCv,S._img)}
  sweepTick();
  drawMeter(el.seekCv,el.seek.clientHeight);
  updateLyrics();
  requestAnimationFrame(loop);
}

/* resizable widget: refit the perimeter band whenever the box changes */
new ResizeObserver(()=>drawEdge(el.edgeCv,S._img)).observe(el.wbody);

/* track-change bookkeeping */
document.addEventListener("halftone:track",()=>{
  const m=S.meta;
  el.tTitle.textContent=m?m.title:"\u2014";
  el.tTech.textContent=m?`${m.streaminfo.sample_rate/1000} kHz / ${m.streaminfo.bits}-BIT / ${m.streaminfo.channels===2?"STEREO":m.streaminfo.channels+"CH"}`:"\u2014";
  el.trkNo.textContent="HALFTONE / "+String(S.i+1).padStart(2,"0")+" / "+String(S.lib.length).padStart(2,"0");
  el.tTot.textContent=fmt(m?m.duration_s:0);
  el.btnLyrics.classList.toggle("lrc-available",S.lyrics.length>0);
  if(S.lyricsOpen){S.lyrics.length?el.lrcHint.classList.remove("show"):el.lrcHint.classList.add("show")}
  drawCover();
  buildQueue();
});

/* QA surface */
window.__qa={
  state:()=>({lib:S.lib.length,i:S.i,playing:S.playing&&!el.aud.paused,
              dur:+(el.aud.duration||0).toFixed(2),src:el.aud.src.slice(0,60),
              vol:S.vol,pinned:S.pinned,lyricsOpen:S.lyricsOpen,
              lrc:S.lyrics.length,root:S.root,liked:S.liked.size,
              meta:S.meta?{sr:S.meta.streaminfo.sample_rate,bits:S.meta.streaminfo.bits,
                ch:S.meta.streaminfo.channels,cover:!!S.meta.cover,blocks:S.meta.block_types}:null}),
  meter:()=>({maxBar:+Math.max(...EMA).toFixed(3),sweep:+SWEEP.v.toFixed(3),alive:EMA.some(v=>v>.02),ctx:AC?AC.state:"none"}),
  sweepState:()=>({t:+SWEEP.t.toFixed(2),dir:SWEEP.dir,v:+SWEEP.v.toFixed(3),drag:S.drag!=null}),
  accent:()=>({rgb:"rgb("+ACC.hex.join(",")+")",animating:ACC.anim,
               ratioVsBg:+ratio(lum(...ACC.hex),BG_LUM).toFixed(2)}),
  artLit:()=>{if(S.cfg.art==="real")return +(el.artImg.style.display!=="none"&&el.artImg.complete&&el.artImg.naturalWidth>0);
    const g=el.artCv.getContext("2d");const d=g.getImageData(0,0,el.artCv.width,el.artCv.height).data;
    let lit=0,n=0;for(let i=0;i<d.length;i+=64){n++;if(d[i]>32||d[i+1]>32||d[i+2]>32)lit++}
    return +(lit/n).toFixed(3)},
  edgeLit:()=>{const g=el.edgeCv.getContext("2d");const d=g.getImageData(0,0,el.edgeCv.width,el.edgeCv.height).data;
    let lit=0,n=0;for(let i=0;i<d.length;i+=64){n++;if(d[i]>32||d[i+1]>32||d[i+2]>32)lit++}
    return +(lit/n).toFixed(3)},
  cfg:()=>({...S.cfg}),
  setCfg:(k,v)=>{setCfg(k,v);return {...S.cfg}},
  artSet(mode){setCfg("art",mode);return {art:S.cfg.art,
    realShown:el.artImg.style.display!=="none",cvShown:el.artCv.style.display!=="none"}},
  transport:()=>({shuffle:S.shuffle,repeat:S.repeat}),
  transportSet(kind){kind==="shuffle"?el.btnShuf.click():el.btnRep.click();return this.transport()},
  drawer(open){el.queue.classList.toggle("open",open===undefined?!el.queue.classList.contains("open"):open);
    return {open:el.queue.classList.contains("open"),side:!!S.cfg.queueSide,
            rows:el.qrows.children.length,rect:(()=>{const r=el.queue.getBoundingClientRect();
              return {x:r.x,y:r.y,w:r.width,h:r.height}})()}},
  ctx(x,y){el.widget.dispatchEvent(new MouseEvent("contextmenu",{clientX:x||120,clientY:120,bubbles:true,cancelable:true}));
    return document.querySelectorAll(".ctxmenu .ctxitem").length},
  async win(){try{const sf=await curWin.scaleFactor(),s=await curWin.innerSize();
    return {w:+(s.width/sf).toFixed(0),h:+(s.height/sf).toFixed(0),
            resizable:await curWin.isResizable(),alwaysOnTop:await curWin.isAlwaysOnTop()}}catch(e){return {err:""+e}}},
  dragAPI:()=>({startDragging:typeof (curWin&&curWin.startDragging)}),
  async lyrics(open){await setLyricsOpen(open);return {open:S.lyricsOpen,hasLrc:S.lyrics.length>0}},
  async play(){await setPlaying(true);return this.state()},
  async pause(){await setPlaying(false);return this.state()},
  async load(i){await loadTrack(i);return this.state()},
  async scan(dir){const r=await scanLibrary(dir);return {tracks:r.tracks.length,skipped:r.skipped.length}},
  async dragSim(x0,x1){ /* synthetic drag sweep for QA */
    const seek=el.seek;const r=seek.getBoundingClientRect();
    const ev=(t,px)=>new PointerEvent(t,{clientX:r.left+r.width*px,clientY:r.top+r.height/2,bubbles:true,pointerId:9,isPrimary:true,pointerType:'mouse'});
    seek.dispatchEvent(ev('pointerdown',x0));
    for(let k=0;k<=6;k++){seek.dispatchEvent(ev('pointermove',x0+(x1-x0)*k/6))}
    seek.dispatchEvent(ev('pointerup',x1));
    return this.sweepState();
  },
  async mainVis(){try{const all=await T.window.getAllWindows();const m=all.find(w=>w.label==="main");
    return m?{exists:true,visible:await m.isVisible()}:null}catch(e){return {err:""+e}}},
  async openMain(){el.btnMax.click();await new Promise(r=>setTimeout(r,500));return await this.mainVis()},
};

/* boot: default collapsed; restore library + first paint */
applyAccent();
applyCfg();
requestAnimationFrame(loop);
(async()=>{
  if(S.cfg.cover==="large")await shiftH(COV_D);
  if(S.pinned){try{await curWin.setAlwaysOnTop(true);document.title="pinned"}catch(_){}}
  if(S.root){el.libpath.value=S.root;const r=await scanLibrary(S.root);
    if(r&&r.tracks.length){
      el.tTitle.textContent=S.lib[0].title;
      el.tTech.textContent="READY / "+S.lib.length+" TRACKS";
      const li=S._lastTrack!=null?S._lastTrack:null;
      await loadTrack(li!=null&&li>=0&&li<S.lib.length?li:0,false);
      if(S.lyricsOpen)await setLyricsOpen(true);   /* persisted open -> keep, hint if no lrc */
    }
  }
})();
</script>
</body>
</html>
