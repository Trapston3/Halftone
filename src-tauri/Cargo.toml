[package]
name = "halftone"
version = "0.2.2"
description = "Floating desktop mini-player widget for a local music library"
license = "MIT"
edition = "2021"
rust-version = "1.77"
default-run = "halftone"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
rayon = "1"
notify = "7"
symphonia = { version = "0.5.5", default-features = false, features = ["isomp4", "alac"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "Media_Playback",
  "Media_MediaProperties",
  "Media",
  "Storage_Streams",
  "Storage",
  "Foundation",
  "Win32_Foundation",
  "Win32_Media",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = true }

[[bin]]
name = "halftone-verify"
path = "src/bin/halftone-verify.rs"

[lib]
name = "halftone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
