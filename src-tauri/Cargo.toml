[package]
name = "halftone"
version = "0.1.0"
description = "Floating desktop mini-player widget for a local music library"
license = "MIT"
edition = "2021"
rust-version = "1.77"
default-run = "halftone"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
windows-core = "0.58"
windows = { version = "0.58", features = [
  "Media_Playback",
  "Media_MediaProperties",
  "Media",
  "Storage_Streams",
  "Storage",
  "Foundation",
  "Win32_Foundation",
  "Win32_Media",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "halftone-verify"
path = "src/bin/halftone-verify.rs"

[lib]
name = "halftone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
